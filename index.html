<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FoodGo Local - Đặc Sản & Ẩm Thực Trà Bồng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Nhúng Leaflet CSS cho Bản đồ trực tuyến -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .field { width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #111827; background: #fff; outline: none; transition: all 0.2s; }
    .field:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,.15); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #map { height: 180px; width: 100%; border-radius: 1rem; z-index: 10; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="app" class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-2xl relative pb-24 border-x border-gray-200"></div>

  <!-- Leaflet JS cho Bản đồ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- BỘ NHỚ LƯU TRỮ CỤC BỘ SAFE-STORAGE ---
    const STORAGE = {
      stores: 'foodgo_v5_stores',
      foods: 'foodgo_v5_foods',
      cart: 'foodgo_v5_cart',
      orders: 'foodgo_v5_orders',
      favorites: 'foodgo_v5_favorites',
      profile: 'foodgo_v5_profile',
      area: 'foodgo_v5_area',
      shipping: 'foodgo_v5_shipping_fee'
    };

    const TRABONG_HAMLETS = [
      'Thôn 1 (Trung tâm xã)',
      'Thôn 2',
      'Thôn 3',
      'Thôn Trà Bãi',
      'Thôn Trà Na'
    ];

    const ADMINISTRATIVE_LOCATIONS = [
      { id: 'tb_trabong', name: 'Xã Trà Bồng', district: 'Trà Bồng', lat: 15.1583, lng: 108.3833 },
      { id: 'tb_dongtrabong', name: 'Xã Đông Trà Bồng', district: 'Trà Bồng', lat: 15.1700, lng: 108.4200 },
      { id: 'tb_thanhbong', name: 'Xã Thanh Bồng', district: 'Trà Bồng', lat: 15.1300, lng: 108.3500 },
      { id: 'tb_taytrabong', name: 'Xã Tây Trà Bồng', district: 'Trà Bồng', lat: 15.1900, lng: 108.3100 },
      { id: 'tb_taytra', name: 'Xã Tây Trà', district: 'Trà Bồng', lat: 15.2200, lng: 108.2800 }
    ];

    // XÓA SẠCH DỮ LIỆU DEMO: Khởi tạo danh sách cửa hàng và món ăn rỗng hoàn toàn để người dùng tự nhập thực tế
    const INITIAL_STORES = [];
    const INITIAL_FOODS = [];

    function readStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch { return fallback; }
    }

    function safeWrite(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    // STATE HỆ THỐNG
    let state = {
      role: 'buyer',
      activeTab: 'home',
      selectedAreaId: readStorage(STORAGE.area, 'tb_trabong'),
      stores: readStorage(STORAGE.stores, INITIAL_STORES),
      foods: readStorage(STORAGE.foods, INITIAL_FOODS),
      cart: readStorage(STORAGE.cart, []),
      orders: readStorage(STORAGE.orders, []),
      favorites: readStorage(STORAGE.favorites, []),
      profile: readStorage(STORAGE.profile, { name: '', phone: '', hamlet: TRABONG_HAMLETS[0], addressDetail: '' }),
      shippingFee: readStorage(STORAGE.shipping, 15000),
      serviceFee: 0,
      merchantStoreId: '',
      searchQuery: '',
      selectedCategory: 'Tất cả',
      selectedStoreId: 'all',
      selectedFood: null,
      selectedVariantId: '',
      foodQuantity: 1,
      foodNote: '',
      pendingAdd: null,
      showCheckout: false,
      showOrderDetail: null,
      showFoodForm: false,
      editingFoodId: null,
      foodForm: { name: '', price: '', category: 'Món ăn', description: '', image: '' },
      showStoreForm: false,
      newStoreForm: { name: '', category: 'Đặc sản địa phương', address: '', phone: '' },
      checkoutName: '',
      checkoutPhone: '',
      checkoutHamlet: TRABONG_HAMLETS[0],
      checkoutAddressDetail: '',
      checkoutNote: '',
      checkoutError: '',
      toast: '',
      shippingInput: '15000',
      audioEnabled: false,
      showMap: false,
      isListening: false // Trạng thái nhận diện giọng nói
    };

    let mapInstance = null;

    function saveState() {
      safeWrite(STORAGE.stores, state.stores);
      safeWrite(STORAGE.foods, state.foods);
      safeWrite(STORAGE.cart, state.cart);
      safeWrite(STORAGE.orders, state.orders);
      safeWrite(STORAGE.favorites, state.favorites);
      safeWrite(STORAGE.profile, state.profile);
      safeWrite(STORAGE.area, state.selectedAreaId);
      safeWrite(STORAGE.shipping, state.shippingFee);
    }

    function money(val) {
      return (Math.max(0, Math.round(val || 0))).toLocaleString('vi-VN') + 'đ';
    }

    function formatDate(isoStr) {
      try {
        return new Date(isoStr).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch { return isoStr; }
    }

    function showToast(msg) {
      state.toast = msg;
      render();
      setTimeout(() => { if (state.toast === msg) { state.toast = ''; render(); } }, 3500);
    }

    // TÍNH NĂNG TÌM KIẾM VÀ ĐẶT MÓN BẰNG GIỌNG NÓI (VOICE SEARCH & ORDER)
    function startVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('Trình duyệt của bạn không hỗ trợ nhận diện giọng nói (Voice Search). Hãy dùng Google Chrome!');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      state.isListening = true;
      showToast('🎙️ Đang nghe... Hãy nói tên món ăn bạn muốn tìm!');
      render();

      recognition.onresult = function(event) {
        const speechResult = event.results[0][0].transcript;
        state.isListening = false;
        state.searchQuery = speechResult.trim();
        state.activeTab = 'explore';
        showToast(`🎙️ Đã nhận diện: "${speechResult}"`);
        render();
      };

      recognition.onerror = function(event) {
        state.isListening = false;
        showToast('Không nhận diện được giọng nói. Vui lòng thử lại.');
        render();
      };

      recognition.onend = function() {
        if (state.isListening) {
          state.isListening = false;
          render();
        }
      };

      try {
        recognition.start();
      } catch (e) {
        state.isListening = false;
        render();
      }
    }

    function enableAudioAlert() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        ctx.resume().then(() => {
          state.audioEnabled = true;
          showToast('🔔 Đã bật âm thanh chuông báo đơn mới!');
          render();
        });
      } catch {
        showToast('Trình duyệt không hỗ trợ AudioContext.');
      }
    }

    function playNotificationSound() {
      if (!state.audioEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {}
    }

    const STATUS_LABEL = {
      PENDING_CONFIRMATION: 'Chờ quán xác nhận',
      ACCEPTED: 'Quán đã nhận đơn',
      PREPARING: 'Đang chuẩn bị món',
      READY_FOR_PICKUP: 'Đã nấu xong',
      DELIVERING: 'Đang giao hàng',
      COMPLETED: 'Đã hoàn thành',
      CANCELLED: 'Đã hủy'
    };

    function statusColor(status) {
      if (status === 'COMPLETED') return 'bg-emerald-100 text-emerald-800 border-emerald-300';
      if (status === 'CANCELLED') return 'bg-rose-100 text-rose-800 border-rose-300';
      if (status === 'PENDING_CONFIRMATION') return 'bg-amber-100 text-amber-800 border-amber-300';
      return 'bg-sky-100 text-sky-800 border-sky-300';
    }

    function setRole(r) { state.role = r; state.activeTab = 'home'; render(); }
    function setTab(t) { state.activeTab = t; render(); }
    function setArea(id) { state.selectedAreaId = id; state.selectedStoreId = 'all'; saveState(); render(); }
    
    function toggleFavorite(id) {
      if (state.favorites.includes(id)) state.favorites = state.favorites.filter(x => x !== id);
      else state.favorites.push(id);
      saveState();
      render();
    }

    function openFoodModal(food) {
      state.selectedFood = food;
      state.selectedVariantId = food.variants && food.variants.length ? food.variants[0].id : '';
      state.foodQuantity = 1;
      state.foodNote = '';
      render();
    }

    function requestAddToCart(food, qty = 1, variantLabel = '', unitPrice = food.price, note = '', variantDelta = 0, variantId = '') {
      const store = state.stores.find(s => s.id === food.storeId);
      if (!store || !store.isOpen) { showToast('Cửa hàng hiện đang tạm nghỉ.'); return; }
      if (!food.inStock) { showToast('Món này hiện đã hết hàng.'); return; }

      const pending = { food, variantLabel, variantId, unitPrice, variantDelta, note };
      if (state.cart.length && state.cart[0].storeId !== food.storeId) {
        state.pendingAdd = pending;
        render();
        return;
      }
      addResolvedItem(pending, qty);
    }

    function addResolvedItem(pending, qty = 1) {
      const { food, variantLabel, variantId, unitPrice, variantDelta, note } = pending;
      const store = state.stores.find(s => s.id === food.storeId);
      const cartKey = [food.id, variantId || '', variantLabel, note.trim()].join('::');
      const existing = state.cart.find(i => i.cartKey === cartKey);
      
      if (existing) {
        existing.quantity += qty;
      } else {
        state.cart.push({
          cartKey, foodId: food.id, storeId: food.storeId, storeName: store ? store.name : 'Cửa hàng',
          name: food.name, category: food.category, image: food.image, unitPrice, basePrice: food.price, variantDelta,
          quantity: qty, variantLabel: variantLabel || undefined, variantId: variantId || undefined, note: note.trim() || undefined
        });
      }
      state.pendingAdd = null;
      state.selectedFood = null;
      saveState();
      showToast(`Đã thêm ${food.name} vào giỏ hàng.`);
    }

    function updateCartQuantity(cartKey, delta) {
      const item = state.cart.find(i => i.cartKey === cartKey);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) state.cart = state.cart.filter(i => i.cartKey !== cartKey);
        saveState();
        render();
      }
    }

    function removeCartItem(cartKey) {
      state.cart = state.cart.filter(i => i.cartKey !== cartKey);
      saveState();
      render();
    }

    function startCheckout() {
      if (!state.cart.length) return;
      state.checkoutName = state.profile.name;
      state.checkoutPhone = state.profile.phone;
      state.checkoutHamlet = state.profile.hamlet || TRABONG_HAMLETS[0];
      state.checkoutAddressDetail = state.profile.addressDetail || '';
      state.checkoutError = '';
      state.showCheckout = true;
      render();
    }

    function placeOrder() {
      const name = state.checkoutName.trim();
      const phone = state.checkoutPhone.trim();
      const detail = state.checkoutAddressDetail.trim();
      
      if (!name || !phone || !detail) {
        state.checkoutError = 'Vui lòng nhập đầy đủ họ tên, SĐT và địa chỉ chi tiết.';
        render();
        return;
      }
      if (!/^(0|\+84)[3|5|7|8|9][0-9]{8}$/.test(phone.replace(/[ .-]/g, ''))) {
        state.checkoutError = 'Số điện thoại chưa hợp lệ. Vui lòng kiểm tra lại.';
        render();
        return;
      }

      const cartStore = state.stores.find(s => s.id === state.cart[0].storeId);
      const subtotal = state.cart.reduce((s, i) => s + i.unitPrice * i.quantity, 0);
      const now = new Date().toISOString();
      const orderId = 'FG-' + new Date().getFullYear() + String(new Date().getMonth()+1).padStart(2,'0') + String(new Date().getDate()).padStart(2,'0') + '-' + Math.random().toString(36).slice(2, 7).toUpperCase();
      const fullAddress = `${detail}, ${state.checkoutHamlet}, Xã Trà Bồng`;

      const newOrder = {
        id: orderId,
        storeId: cartStore.id,
        storeName: cartStore.name,
        items: [...state.cart],
        subtotal,
        shippingFee: state.shippingFee,
        serviceFee: 0,
        total: subtotal + state.shippingFee,
        status: 'PENDING_CONFIRMATION',
        customerName: name,
        customerPhone: phone,
        deliveryAddress: fullAddress,
        customerNote: state.checkoutNote.trim(),
        paymentMethod: 'COD',
        createdAt: now,
        updatedAt: now,
        events: [{ status: 'PENDING_CONFIRMATION', label: 'Khách gửi yêu cầu đặt hàng', at: now, by: 'Khách hàng' }]
      };

      state.orders.unshift(newOrder);
      state.profile = { name, phone, hamlet: state.checkoutHamlet, addressDetail: detail };
      state.cart = [];
      state.showCheckout = false;
      state.checkoutNote = '';
      state.activeTab = 'orders';
      saveState();
      playNotificationSound();
      showToast(`Tạo đơn ${orderId} thành công! Đang đợi quán xác nhận.`);
    }

    function updateOrderStatus(orderId, status, actor) {
      const label = status === 'CANCELLED' ? `Hủy bởi ${actor}` : STATUS_LABEL[status];
      const at = new Date().toISOString();
      state.orders = state.orders.map(o => o.id === orderId ? {
        ...o, status, updatedAt: at,
        events: [...o.events, { status, label, at, by: actor }]
      } : o);
      if (state.showOrderDetail && state.showOrderDetail.id === orderId) {
        state.showOrderDetail.status = status;
        state.showOrderDetail.events.push({ status, label, at, by: actor });
      }
      saveState();
      showToast(`${orderId}: ${label}.`);
    }

    function merchantNextAction(order) {
      if (order.status === 'PENDING_CONFIRMATION') return { status: 'ACCEPTED', label: 'Chấp nhận đơn' };
      if (order.status === 'ACCEPTED') return { status: 'PREPARING', label: 'Bắt đầu làm món' };
      if (order.status === 'PREPARING') return { status: 'READY_FOR_PICKUP', label: 'Nấu xong, chờ giao' };
      if (order.status === 'READY_FOR_PICKUP') return { status: 'DELIVERING', label: 'Bắt đầu giao hàng' };
      if (order.status === 'DELIVERING') return { status: 'COMPLETED', label: 'Xác nhận hoàn tất' };
      return null;
    }

    function createNewStore(e) {
      e.preventDefault();
      const name = state.newStoreForm.name.trim();
      const phone = state.newStoreForm.phone.trim();
      const address = state.newStoreForm.address.trim();
      if (!name || !phone || !address) { showToast('Vui lòng điền đầy đủ tên quán, SĐT và địa chỉ.'); return; }
      
      const newId = 's_' + Date.now();
      const newStore = {
        id: newId,
        name,
        category: state.newStoreForm.category,
        address,
        areaId: state.selectedAreaId,
        image: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=700&q=80',
        isOpen: true,
        prepTime: '15-20 phút',
        phone
      };
      state.stores.push(newStore);
      state.merchantStoreId = newId;
      state.showStoreForm = false;
      state.newStoreForm = { name: '', category: 'Đặc sản địa phương', address: '', phone: '' };
      saveState();
      showToast(`Đã tạo thành công cửa hàng "${name}".`);
    }

    function toggleStoreOpen(storeId) {
      state.stores = state.stores.map(s => s.id === storeId ? { ...s, isOpen: !s.isOpen } : s);
      saveState();
      render();
    }

    function toggleFoodStock(foodId) {
      state.foods = state.foods.map(f => f.id === foodId ? { ...f, inStock: !f.inStock } : f);
      saveState();
      render();
    }

    function saveFood() {
      const name = state.foodForm.name.trim();
      const price = Number(state.foodForm.price);
      const desc = state.foodForm.description.trim();
      const category = state.foodForm.category;
      const customImage = state.foodForm.image.trim() || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=700&q=80';

      if (!name || !Number.isFinite(price) || price < 0) {
        showToast('Vui lòng nhập tên món và giá bán hợp lệ.');
        return;
      }
      if (!state.merchantStoreId) {
        showToast('Vui lòng tạo hoặc chọn cửa hàng trước khi thêm món.');
        return;
      }

      if (state.editingFoodId) {
        state.foods = state.foods.map(f => f.id === state.editingFoodId ? { ...f, name, price: Math.round(price), category, description: desc, image: customImage } : f);
        showToast('Đã cập nhật món ăn.');
      } else {
        const newFood = {
          id: 'f-' + Date.now(),
          storeId: state.merchantStoreId,
          name, price: Math.round(price),
          category,
          description: desc,
          image: customImage,
          inStock: true
        };
        state.foods.unshift(newFood);
        showToast('Đã thêm món mới tuỳ ý thành công.');
      }
      state.showFoodForm = false;
      saveState();
      render();
    }

    function initMap(lat, lng) {
      const mapContainer = document.getElementById('map');
      if (!mapContainer) return;
      if (mapInstance) {
        mapInstance.remove();
        mapInstance = null;
      }
      try {
        mapInstance = L.map('map').setView([lat, lng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap contributors'
        }).addTo(mapInstance);
        
        state.stores.forEach(store => {
          L.marker([lat + (Math.random()*0.02 - 0.01), lng + (Math.random()*0.02 - 0.01)]).addTo(mapInstance)
            .bindPopup(`<b>${store.name}</b><br>${store.address}`);
        });
      } catch (e) { console.log('Map load error', e); }
    }

    function renderFoodCard(food) {
      const store = state.stores.find(s => s.id === food.storeId);
      const isFav = state.favorites.includes(food.id);
      return `
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex gap-3 p-2.5">
          <button type="button" onclick="openFoodModal(state.foods.find(f => f.id === '${food.id}'))" class="w-24 h-24 shrink-0 rounded-xl overflow-hidden bg-gray-100">
            <img src="${food.image}" alt="${food.name}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x200/059669/ffffff?text=FoodGo';" />
          </button>
          <div class="min-w-0 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex items-start gap-1">
                <button type="button" onclick="openFoodModal(state.foods.find(f => f.id === '${food.id}'))" class="text-left font-bold text-sm text-gray-900 line-clamp-2 flex-1">${food.name}</button>
                <button type="button" onclick="toggleFavorite('${food.id}')" class="p-1 text-rose-500">
                  <svg class="w-4 h-4 ${isFav ? 'fill-rose-500 text-rose-500' : 'text-gray-300'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
              </div>
              <p class="text-[11px] text-gray-500 line-clamp-2 mt-1">${food.description || 'Món ngon thực tế'}</p>
              <p class="text-[10px] text-gray-400 mt-1 truncate">${store ? store.name : 'Cửa hàng'}</p>
            </div>
            <div class="flex items-center justify-between gap-2 mt-2">
              <div>
                <p class="font-extrabold text-emerald-700 text-sm">${money(food.price)}</p>
                <p class="text-[10px] ${food.inStock && store && store.isOpen ? 'text-emerald-700 font-semibold' : 'text-rose-600'}">
                  ${!store || !store.isOpen ? 'Quán tạm nghỉ' : food.inStock ? 'Còn nhận đặt' : 'Hết món'}
                </p>
              </div>
              <button type="button" ${!food.inStock || !store || !store.isOpen ? 'disabled' : ''} onclick="requestAddToCart(state.foods.find(f => f.id === '${food.id}'))" class="px-3 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold disabled:bg-gray-200 disabled:text-gray-400 flex items-center gap-1 shadow-sm">
                + Thêm
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderOrderCard(order, merchantMode = false) {
      const next = merchantMode ? merchantNextAction(order) : null;
      return `
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3.5 space-y-3 mb-3">
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="text-xs font-extrabold text-gray-900">${order.id}</p>
              <p class="text-[11px] text-gray-500 mt-0.5">${formatDate(order.createdAt)}</p>
            </div>
            <span class="text-[10px] font-bold px-2.5 py-1 rounded-full border ${statusColor(order.status)}">${STATUS_LABEL[order.status]}</span>
          </div>
          <div class="border-t border-b border-gray-100 py-2 space-y-1">

            ${order.items.map(item => `

              <div class="flex justify-between"><span>Phí giao hàng:</span><span>${money(order.shippingFee)}</span></div>

          </div>

          ${merchantMode ? `

          <div class="flex items-center justify-between">
            <div><p class="text-[10px] text-gray-500">Khách thanh toán COD</p><p class="text-sm font-extrabold text-emerald-700">${money(order.total)}</p></div>
            <button type="button" onclick="state.showOrderDetail = state.orders.find(o => o.id === '${order.id}'); render();" class="text-xs font-bold text-emerald-700 px-3 py-2 rounded-lg bg-emerald-50">Chi tiết</button>
          </div>

          ${merchantMode && order.status === 'PENDING_CONFIRMATION' ? `
            <button type="button" onclick="updateOrderStatus('${order.id}', 'CANCELLED', 'Chủ quán')" class="w-full py-2 rounded-xl border border-rose-200 text-rose-700 text-xs font-bold">Từ chối nhận đơn</button>
          ` : ''}
          ${merchantMode && next ? `
            <button type="button" onclick="updateOrderStatus('${order.id}', '${next.status}', 'Chủ quán')" class="w-full py-2.5 rounded-xl bg-emerald-700 text-white text-xs font-bold shadow-sm">${next.label}</button>
          ` : ''}
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      const selectedArea = ADMINISTRATIVE_LOCATIONS.find(a => a.id === state.selectedAreaId) || ADMINISTRATIVE_LOCATIONS[0];
      const areaStores = state.stores.filter(s => s.areaId === state.selectedAreaId);
      const storeById = Object.fromEntries(state.stores.map(s => [s.id, s]));

      const query = state.searchQuery.trim().toLowerCase();
      const visibleFoods = state.foods.filter(food => {
        const store = storeById[food.storeId];
        const inArea = store && store.areaId === state.selectedAreaId;
        const inStore = state.selectedStoreId === 'all' || food.storeId === state.selectedStoreId;
        const categoryMatch = state.selectedCategory === 'Tất cả' || food.category === state.selectedCategory;
        const searchMatch = !query || `${food.name} ${food.description} ${food.category} ${store ? store.name : ''}`.toLowerCase().includes(query);
        return inArea && inStore && categoryMatch && searchMatch;
      });

      const cartSubtotal = state.cart.reduce((s, i) => s + i.unitPrice * i.quantity, 0);
      const cartCount = state.cart.reduce((s, i) => s + i.quantity, 0);
      const effectiveShipping = state.cart.length ? state.shippingFee : 0;
      const checkoutTotal = cartSubtotal + effectiveShipping;

      if (!state.merchantStoreId && state.stores.length > 0) {
        state.merchantStoreId = state.stores[0].id;
      }
      const currentMerchantStore = state.stores.find(s => s.id === state.merchantStoreId);
      const currentMerchantFoods = state.foods.filter(f => f.storeId === currentMerchantStore?.id);
      const merchantOrders = state.orders.filter(o => o.storeId === state.merchantStoreId).sort((a,b) => b.createdAt.localeCompare(a.createdAt));
      const buyerOrders = [...state.orders].sort((a,b) => b.createdAt.localeCompare(a.createdAt));
      const categories = ['Tất cả', ...Array.from(new Set(state.foods.map(f => f.category)))];

      let html = `
        <header class="sticky top-0 z-30 bg-emerald-800 text-white shadow-md">
          <div class="px-4 pt-3 pb-3 space-y-3">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-2 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-amber-400 text-emerald-950 flex items-center justify-center font-black text-lg shadow-sm">FG</div>
                <div class="min-w-0">
                  <h1 class="font-extrabold text-base leading-tight">FoodGo Local</h1>
                  <p class="text-[10px] text-emerald-100">Đặc sản Trà Bồng (Miễn phí dịch vụ)</p>
                </div>
              </div>
              <label class="flex items-center gap-1.5 text-[10px] bg-emerald-900/80 rounded-xl px-2.5 py-2 border border-emerald-600">
                <span class="text-emerald-200">Vai trò:</span>
                <select onchange="setRole(this.value)" class="bg-transparent text-white font-bold outline-none cursor-pointer">
                  <option value="buyer" class="text-gray-900" ${state.role === 'buyer' ? 'selected' : ''}>Khách hàng</option>
                  <option value="merchant" class="text-gray-900" ${state.role === 'merchant' ? 'selected' : ''}>Chủ quán</option>
                  <option value="admin" class="text-gray-900" ${state.role === 'admin' ? 'selected' : ''}>Admin</option>
                </select>
              </label>
            </div>
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4 text-amber-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <select onchange="setArea(this.value)" class="flex-1 min-w-0 bg-emerald-900/60 border border-emerald-600 rounded-lg px-2 py-2 text-xs font-semibold text-white outline-none cursor-pointer">
                ${ADMINISTRATIVE_LOCATIONS.map(a => `<option value="${a.id}" class="text-gray-900" ${a.id === state.selectedAreaId ? 'selected' : ''}>${a.name}</option>`).join('')}
              </select>
            </div>
            ${state.role === 'buyer' ? `
              <div class="flex gap-2">
                <div class="relative flex-1">
                  <input value="${state.searchQuery}" oninput="state.searchQuery = this.value; if(this.value) state.activeTab='explore'; render();" placeholder="Tìm món ăn, đặc sản Trà Bồng..." class="w-full rounded-xl bg-white text-gray-900 pl-9 pr-8 py-2.5 text-xs outline-none placeholder:text-gray-400 shadow-inner" />

                  ${state.searchQuery ? `<button onclick="state.searchQuery=''; render();" class="absolute right-2 top-2 p-1 text-gray-400">✕</button>` : ''}

                <button onclick="startVoiceRecognition()" title="Tìm món bằng giọng nói" class="bg-amber-400 hover:bg-amber-500 text-emerald-950 px-3 py-2.5 rounded-xl font-bold text-xs flex items-center gap-1 shadow-sm shrink-0">
                  🎙️ ${state.isListening ? 'Đang nghe...' : 'Nói'}
                </button>
              </div>
            ` : ''}
          </div>
        </header>

      // 1. KHÁCH HÀNG (BUYER)
      if (state.role === 'buyer') {
        html += `<main class="px-3 pt-3 space-y-5">`;

        if (state.activeTab === 'home') {

              <div class="relative z-10">
                <span class="inline-flex bg-amber-400 text-emerald-950 text-[9px] px-2 py-0.5 rounded-full font-extrabold">0Đ PHÍ DỊCH VỤ</span>

                <p class="text-[11px] text-emerald-100 mt-1">Hệ thống gọi món trực tiếp từ các quán tự do tại địa phương</p>

                  <button onclick="setTab('explore')" class="bg-white text-emerald-800 rounded-xl px-3 py-2 text-xs font-extrabold shadow-sm">Khám phá thực đơn →</button>

                      <img src="${store.image}" alt="${store.name}" class="w-full h-28 object-cover" />
                      <div class="p-3">
                        <div class="flex justify-between gap-2"><b class="text-xs line-clamp-2">${store.name}</b><span class="shrink-0 text-[9px] px-2 py-0.5 rounded-full h-fit ${store.isOpen ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-500'}">${store.isOpen ? 'Đang mở' : 'Tạm nghỉ'}</span></div>
                        <p class="text-[10px] text-gray-500 mt-1">${store.category} · ${store.address}</p>
                      </div>
                    </button>
                  `).join('')}
                </div>
              `}
            </section>

            <section class="space-y-2">
              <div class="flex items-center justify-between"><h3 class="font-extrabold text-sm text-gray-800">Thực đơn thực tế</h3><button onclick="setTab('explore')" class="text-xs text-emerald-700 font-bold">Xem tất cả</button></div>
              <div class="space-y-3">
                ${visibleFoods.length ? visibleFoods.slice(0, 4).map(renderFoodCard).join('') : `<p class="text-xs text-gray-400 text-center py-4">Chưa có món ăn nào được đăng bán.</p>`}
              </div>
            </section>
          `;
        }

        if (state.activeTab === 'explore') {
          html += `
            <div class="flex justify-between items-center gap-2">
              <div><h2 class="font-extrabold text-base">Thực đơn thực tế</h2><p class="text-[10px] text-gray-500 mt-0.5">${selectedArea.name} · ${visibleFoods.length} món</p></div>
              <button onclick="state.searchQuery=''; state.selectedCategory='Tất cả'; state.selectedStoreId='all'; render();" class="text-xs text-emerald-700 font-bold">Đặt lại lọc</button>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
              ${categories.map(cat => `<button onclick="state.selectedCategory='${cat}'; render();" class="whitespace-nowrap px-3 py-2 rounded-full text-[11px] font-bold border ${state.selectedCategory === cat ? 'bg-emerald-700 text-white border-emerald-700' : 'bg-white text-gray-600 border-gray-200'}">${cat}</button>`).join('')}
            </div>
            <select onchange="state.selectedStoreId=this.value; render();" class="w-full p-3 rounded-xl border border-gray-200 bg-white text-xs outline-none">
              <option value="all">Tất cả cửa hàng trong khu vực</option>
              ${areaStores.map(s => `<option value="${s.id}" ${state.selectedStoreId === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
            </select>
            <div class="space-y-3">
              ${visibleFoods.length ? visibleFoods.map(renderFoodCard).join('') : `<p class="text-xs text-gray-400 py-8 text-center">Không tìm thấy món ăn phù hợp.</p>`}
            </div>
          `;
        }

        if (state.activeTab === 'orders') {
          html += `
            <section class="space-y-3">
              <h2 class="font-extrabold text-base">Đơn hàng của tôi</h2>
              ${buyerOrders.length ? buyerOrders.map(o => renderOrderCard(o)).join('') : `<p class="text-xs text-gray-400 text-center py-10">Bạn chưa có đơn hàng nào.</p>`}
            </section>
          `;

        if (state.activeTab === 'favorites') {
          const favFoods = state.foods.filter(f => state.favorites.includes(f.id));
          html += `

              <h2 class="font-extrabold text-base">Món yêu thích</h2>
              ${favFoods.length ? favFoods.map(renderFoodCard).join('') : `<p class="text-xs text-gray-400 text-center py-10">Chưa có món yêu thích nào.</p>`}
            </section>
          `;
        }

        if (state.activeTab === 'profile') {
          html += `
            <section class="space-y-3">
              <h2 class="font-extrabold text-base">Thông tin nhận hàng</h2>
              <div class="bg-white border border-gray-100 rounded-2xl p-4 space-y-3 shadow-sm">
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Họ và tên người nhận</span><input value="${state.profile.name}" oninput="state.profile.name = this.value;" class="field" placeholder="Nhập họ và tên" /></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Số điện thoại</span><input value="${state.profile.phone}" oninput="state.profile.phone = this.value;" class="field" placeholder="09xxxxxxxx" inputmode="tel" /></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Chọn Thôn/Xóm (Xã Trà Bồng)</span>
                  <select onchange="state.profile.hamlet = this.value;" class="field">
                    ${TRABONG_HAMLETS.map(h => `<option value="${h}" ${state.profile.hamlet === h ? 'selected' : ''}>${h}</option>`).join('')}
                  </select>
                </label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Địa chỉ chi tiết</span><textarea oninput="state.profile.addressDetail = this.value;" class="field min-h-16" placeholder="Số nhà, đường/xóm...">${state.profile.addressDetail || ''}</textarea></label>
                <button onclick="saveState(); showToast('Đã lưu thông tin nhận hàng.');" class="w-full rounded-xl bg-emerald-700 text-white py-3 text-xs font-extrabold shadow-sm">Lưu thông tin</button>
              </div>
            </section>
          `;
        }

        html += `</main>`;

        if (state.cart.length > 0 && !state.showCheckout) {
          html += `
            <div class="fixed bottom-[68px] left-0 right-0 z-30 max-w-md mx-auto px-3">
              <button onclick="startCheckout()" class="w-full rounded-2xl bg-emerald-900 text-white p-3 shadow-2xl flex items-center justify-between gap-3 border border-emerald-700">
                <div class="flex items-center gap-2">
                  <span class="w-9 h-9 rounded-xl bg-amber-400 text-emerald-950 flex items-center justify-center font-black">🛍</span>
                  <div class="text-left"><p class="text-[10px] text-emerald-100">Giỏ hàng · ${cartCount} món (0đ phí dịch vụ)</p><p class="text-sm font-extrabold">${money(cartSubtotal)}</p></div>
                </div>
                <span class="bg-amber-400 text-emerald-950 rounded-xl px-4 py-2 text-xs font-extrabold">Xem giỏ & đặt →</span>
              </button>
            </div>
          `;
        }

        html += `
          <nav class="fixed bottom-0 left-0 right-0 z-30 max-w-md mx-auto bg-white border-t border-gray-200 shadow-lg grid grid-cols-5 px-1 py-2">
            ${[['home', 'Trang chủ'], ['explore', 'Khám phá'], ['orders', 'Đơn hàng'], ['favorites', 'Yêu thích'], ['profile', 'Tài khoản']].map(([t, label]) => `
              <button onclick="setTab('${t}')" class="flex flex-col items-center gap-1 text-[9px] font-semibold ${state.activeTab === t ? 'text-emerald-700 font-bold' : 'text-gray-400'}">
                <span>${t === 'home' ? '🏠' : t === 'explore' ? '🔍' : t === 'orders' ? '📋' : t === 'favorites' ? '❤️' : '👤'}</span>
                <span>${label}</span>
              </button>
            `).join('')}
          </nav>
        `;
      }

      // 2. CHỦ QUÁN (MERCHANT)
      if (state.role === 'merchant') {
        const pendingCount = merchantOrders.filter(o => o.status === 'PENDING_CONFIRMATION').length;
        const currentMonthSales = merchantOrders.filter(o => o.status === 'COMPLETED').reduce((s, o) => s + o.subtotal, 0);

        html += `
          <main class="px-3 pt-4 space-y-4">
            <div class="rounded-2xl bg-emerald-900 text-white p-4 shadow-md">
              <div class="flex justify-between gap-3 items-start">
                <div class="flex-1 min-w-0">
                  <p class="text-[10px] text-emerald-200">QUẢN LÝ GIAN HÀNG CÁ NHÂN</p>
                  <h2 class="font-extrabold text-base mt-1">${currentMerchantStore ? currentMerchantStore.name : 'Chưa chọn cửa hàng'}</h2>
                  <p class="text-[10px] text-emerald-100 mt-0.5">${currentMerchantStore ? `Địa chỉ: ${currentMerchantStore.address} · SĐT: ${currentMerchantStore.phone}` : 'Vui lòng bấm nút bên dưới để tạo quán mới'}</p>
                </div>
              </div>
              ${state.stores.length > 0 ? `
                <div class="mt-3">
                  <label class="text-[10px] text-emerald-100 font-semibold">Chọn cửa hàng quản lý:</label>
                  <select onchange="state.merchantStoreId = this.value; render();" class="mt-1 w-full rounded-lg bg-emerald-950/70 border border-emerald-600 text-white px-2 py-2 text-xs outline-none">
                    ${state.stores.map(s => `<option value="${s.id}" class="text-gray-900" ${s.id === state.merchantStoreId ? 'selected' : ''}>${s.name} (${s.address})</option>`).join('')}
                  </select>
                </div>
              ` : ''}

              <div class="mt-3 pt-3 border-t border-emerald-800 flex items-center justify-between">
                <div>
                  <p class="text-[10px] text-emerald-200">Chuông báo đơn mới:</p>
                  <p class="text-xs font-bold ${state.audioEnabled ? 'text-amber-300' : 'text-rose-300'}">${state.audioEnabled ? '● Đã bật chuông' : '○ Chưa bật'}</p>

            <section class="space-y-3">
              <h3 class="font-extrabold text-sm">Đơn hàng cần xử lý</h3>
              ${merchantOrders.length ? merchantOrders.map(o => renderOrderCard(o, true)).join('') : `<p class="text-xs text-gray-400 py-6 text-center">Chưa có đơn hàng nào.</p>`}
            </section>

            <section class="bg-white rounded-2xl border border-gray-100 p-3 space-y-3 shadow-sm">
              <div class="flex items-center justify-between">
                <div><h3 class="font-extrabold text-sm">Thực đơn tự do của quán</h3></div>
                ${currentMerchantStore ? `
                  <button onclick="state.editingFoodId=null; state.foodForm={name:'', price:'', category:'Món ăn', description:'', image:''}; state.showFoodForm=true; render();" class="bg-emerald-700 text-white rounded-xl px-3 py-2 text-[11px] font-bold">+ Thêm món tuỳ ý</button>
                ` : ''}
              </div>
              ${!currentMerchantStore ? `<p class="text-xs text-gray-400 py-4 text-center">Vui lòng tạo cửa hàng trước khi thêm món.</p>` : currentMerchantFoods.length === 0 ? `<p class="text-xs text-gray-400 py-4 text-center">Chưa có món ăn nào trong quán.</p>` : currentMerchantFoods.map(food => `
                <div class="flex items-center gap-2 border-t border-gray-100 pt-2">
                  <img src="${food.image}" alt="${food.name}" class="w-12 h-12 rounded-lg object-cover" onerror="this.src='https://placehold.co/200x200/059669/ffffff?text=FoodGo';" />
                  <div class="flex-1 min-w-0">
                    <p class="text-xs font-bold truncate">${food.name}</p>
                    <p class="text-[11px] text-emerald-700 font-bold">${money(food.price)}</p>
                  </div>
                  <button onclick="toggleFoodStock('${food.id}')" class="px-2.5 py-1.5 rounded-lg text-[10px] font-bold ${food.inStock ? 'bg-rose-50 text-rose-700' : 'bg-emerald-50 text-emerald-700'}">${food.inStock ? 'Hết món' : 'Mở bán'}</button>
                </div>
              `).join('')}
            </section>
          </main>
        `;
      }

      // 3. ADMIN - HIỂN THỊ TÊN TẤT CẢ CỬA HÀNG VÀ DOANH THU THÁNG TƯƠNG ƯNG
      if (state.role === 'admin') {
        const totalCompletedOrders = state.orders.filter(o => o.status === 'COMPLETED');
        const totalRevenue = totalCompletedOrders.reduce((s, o) => s + o.subtotal, 0);

        html += `
          <main class="px-3 pt-4 space-y-4">
            <div class="rounded-2xl bg-slate-900 text-white p-4 shadow-md">
              <p class="text-[10px] text-slate-300">BẢNG QUẢN TRỊ ADMIN - TOÀN HỆ THỐNG</p>
              <h2 class="font-extrabold text-lg mt-1">FoodGo Admin Dashboard</h2>
            </div>
            
            <div class="grid grid-cols-2 gap-2">
              <div class="bg-white border p-3 rounded-2xl"><p class="text-[10px] text-gray-500">Tổng số cửa hàng</p><p class="text-base font-extrabold mt-1 text-emerald-700">${state.stores.length} quán</p></div>
              <div class="bg-white border p-3 rounded-2xl"><p class="text-[10px] text-gray-500">Tổng doanh thu tháng</p><p class="text-base font-extrabold mt-1 text-emerald-700">${money(totalRevenue)}</p></div>
            </div>

            <!-- HIỂN THỊ DANH SÁCH TẤT CẢ CỬA HÀNG ĐĂNG KÝ VÀ DOANH THU TƯƠNG ỨNG -->
            <section class="bg-white rounded-2xl border p-3 space-y-3 shadow-sm">
              <h3 class="font-extrabold text-sm text-gray-900 border-b pb-2">Danh sách tất cả cửa hàng & Doanh thu tháng hiện tại</h3>
              <div class="space-y-3">
                ${state.stores.length === 0 ? `<p class="text-xs text-gray-400 py-4 text-center">Chưa có cửa hàng nào đăng ký trên hệ thống.</p>` : state.stores.map(store => {
                  const storeOrders = state.orders.filter(o => o.storeId === store.id && o.status === 'COMPLETED');
                  const storeRevenue = storeOrders.reduce((s, o) => s + o.subtotal, 0);
                  const storeTotalOrders = state.orders.filter(o => o.storeId === store.id).length;
                  return `
                    <div class="border border-gray-100 rounded-xl p-3 bg-slate-50 space-y-1">
                      <div class="flex justify-between items-start">
                        <div>
                          <b class="text-xs text-gray-900">${store.name}</b>
                          <p class="text-[10px] text-gray-500">Địa chỉ: ${store.address} · SĐT: ${store.phone}</p>
                        </div>
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${store.isOpen ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-200 text-gray-600'}">${store.isOpen ? 'Đang mở' : 'Tạm nghỉ'}</span>
                      </div>
                      <div class="flex justify-between items-center text-xs pt-1 border-t border-gray-200 mt-2">
                        <span class="text-gray-600">Tổng đơn: <b>${storeTotalOrders}</b></span>
                        <span class="text-emerald-700 font-extrabold">Doanh thu tháng: ${money(storeRevenue)}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          </main>
        `;
      }

      // MODALS
      if (state.selectedFood) {
        const food = state.selectedFood;
        html += `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-4 shadow-2xl">
              <div class="-mx-4 -mt-4 mb-3 relative">
                <img src="${food.image}" class="w-full h-48 object-cover rounded-t-2xl" onerror="this.src='https://placehold.co/400x200/059669/ffffff?text=FoodGo';" />
                <button onclick="state.selectedFood=null; render();" class="absolute top-3 left-3 bg-white/90 rounded-full px-3 py-1 text-gray-800 font-bold text-xs">← Đóng</button>
              </div>
              <h3 class="font-extrabold text-base">${food.name}</h3>
              <p class="text-xs text-gray-500 mt-1">${food.description || 'Không có mô tả chi tiết'}</p>
              <p class="text-sm font-extrabold text-emerald-700 mt-2">${money(food.price)}</p>

              <div class="mt-3">
                <label class="text-xs font-bold">Ghi chú cho quán (không bắt buộc)</label>
                <textarea oninput="state.foodNote=this.value;" class="field mt-1 min-h-16" placeholder="Ví dụ: ít cay, không hành...">${state.foodNote}</textarea>
              </div>

              <div class="flex items-center justify-between mt-4">
                <div class="flex items-center border border-gray-200 rounded-xl">
                  <button onclick="state.foodQuantity = Math.max(1, state.foodQuantity - 1); render();" class="p-2.5 font-bold">-</button>
                  <span class="px-3 text-sm font-bold">${state.foodQuantity}</span>
                  <button onclick="state.foodQuantity = Math.min(50, state.foodQuantity + 1); render();" class="p-2.5 font-bold">+</button>
                </div>
                <button onclick="requestAddToCart(state.selectedFood, state.foodQuantity, '', ${food.price}, state.foodNote)" class="bg-emerald-700 text-white px-4 py-3 rounded-xl text-xs font-extrabold shadow-sm">
                  Thêm vào giỏ · ${money(food.price * state.foodQuantity)}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      if (state.pendingAdd) {
        const pendingStore = state.stores.find(s => s.id === state.pendingAdd.food.storeId);
        html += `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-2xl p-4 shadow-2xl">
              <h3 class="font-extrabold text-base">Giỏ hàng đang có món từ cửa hàng khác</h3>
              <p class="text-xs text-gray-600 mt-2">Mỗi đơn hàng chỉ áp dụng cho một cửa hàng. Bạn muốn xóa giỏ hiện tại và chọn món từ <b>${pendingStore ? pendingStore.name : 'Quán này'}</b>?</p>
              <div class="grid grid-cols-2 gap-2 mt-4">
                <button onclick="state.pendingAdd=null; render();" class="py-3 rounded-xl border text-xs font-bold">Giữ giỏ hiện tại</button>
                <button onclick="state.cart=[]; addResolvedItem(state.pendingAdd);" class="py-3 rounded-xl bg-emerald-700 text-white text-xs font-bold">Đổi sang quán này</button>
              </div>
            </div>
          </div>
        `;
      }

      if (state.showCheckout) {
        html += `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-4 shadow-2xl">
              <div class="flex items-center justify-between border-b pb-3">
                <div><h3 class="font-extrabold text-base">Xác nhận đơn hàng</h3><p class="text-[10px] text-gray-500 mt-0.5">Thanh toán tiền mặt COD · Miễn phí dịch vụ</p></div>
                <button onclick="state.showCheckout=false; render();" class="p-1 text-gray-400">✕</button>
              </div>
              <div class="max-h-48 overflow-y-auto space-y-2 py-3">
                ${state.cart.map(item => `
                  <div class="flex items-center gap-2">
                    <img src="${item.image}" class="w-11 h-11 object-cover rounded-lg" onerror="this.src='https://placehold.co/100x100/059669/ffffff?text=FoodGo';" />
                    <div class="flex-1 min-w-0">
                      <p class="text-xs font-bold truncate">${item.name}</p>
                      <p class="text-[10px] text-emerald-700 font-bold">${money(item.unitPrice)} × ${item.quantity}</p>
                    </div>
                    <button onclick="removeCartItem('${item.cartKey}')" class="p-1 text-rose-500 text-xs font-bold">Xóa</button>
                  </div>
                `).join('')}
              </div>
              <div class="space-y-3 border-t border-gray-100 pt-3">
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Họ và tên người nhận *</span><input value="${state.checkoutName}" oninput="state.checkoutName=this.value;" class="field" placeholder="Họ và tên" /></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Số điện thoại *</span><input value="${state.checkoutPhone}" oninput="state.checkoutPhone=this.value;" class="field" placeholder="09xxxxxxxx" inputmode="tel" /></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Thôn / Xóm (Xã Trà Bồng) *</span>
                  <select onchange="state.checkoutHamlet=this.value;" class="field">
                    ${TRABONG_HAMLETS.map(h => `<option value="${h}" ${state.checkoutHamlet === h ? 'selected' : ''}>${h}</option>`).join('')}
                  </select>
                </label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Địa chỉ chi tiết / Ghi chú giao hàng *</span><textarea oninput="state.checkoutAddressDetail=this.value;" class="field min-h-16" placeholder="Số nhà, đường/xóm...">${state.checkoutAddressDetail}</textarea></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Ghi chú thêm cho quán</span><textarea oninput="state.checkoutNote=this.value;" class="field min-h-14" placeholder="Ví dụ: làm món ít cay...">${state.checkoutNote}</textarea></label>
              </div>
              <div class="rounded-xl bg-slate-50 p-3 mt-3 space-y-2 text-xs">
                <div class="flex justify-between"><span class="text-gray-600">Tạm tính tiền món</span><b>${money(cartSubtotal)}</b></div>
                <div class="flex justify-between"><span class="text-gray-600">Phí giao hàng</span><b>${money(effectiveShipping)}</b></div>
                <div class="flex justify-between text-emerald-700 font-bold"><span>Phí dịch vụ khách hàng</span><b>0đ (Miễn phí)</b></div>
                <div class="flex justify-between border-t border-gray-200 pt-2 text-sm font-extrabold text-emerald-800"><span>Tổng thanh toán COD</span><b>${money(checkoutTotal)}</b></div>
              </div>
              ${state.checkoutError ? `<p class="text-xs text-rose-700 bg-rose-50 rounded-lg p-2 mt-2">${state.checkoutError}</p>` : ''}
              <button onclick="placeOrder()" class="w-full mt-3 py-3.5 rounded-xl bg-emerald-700 text-white text-xs font-extrabold shadow-md">Xác nhận đặt hàng · ${money(checkoutTotal)}</button>
            </div>
          </div>
        `;
      }

      if (state.showOrderDetail) {
        const o = state.showOrderDetail;
        html += `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-4 shadow-2xl">
              <div class="flex items-start justify-between gap-3">
                <div><p class="text-[10px] text-gray-500">MÃ ĐƠN HÀNG</p><h3 class="font-extrabold text-base">${o.id}</h3></div>
                <span class="text-[10px] font-bold px-2 py-1 rounded-full border ${statusColor(o.status)}">${STATUS_LABEL[o.status]}</span>
              </div>
              <div class="mt-3 rounded-xl bg-slate-50 p-3 space-y-1 text-xs">
                <p class="font-bold">${o.storeName}</p>
                <p>Khách hàng: ${o.customerName} · ${o.customerPhone}</p>
                <p>Địa chỉ giao: ${o.deliveryAddress}</p>
              </div>
              <div class="mt-3 border-t border-b border-gray-100 py-2 space-y-1">
                ${o.items.map(item => `
                  <div class="flex justify-between text-xs text-gray-700">
                    <span>${item.name} × ${item.quantity}</span>
                    <span>${money(item.unitPrice * item.quantity)}</span>
                  </div>
                `).join('')}
              </div>
              <div class="space-y-1.5 text-xs text-gray-600 py-2">
                <div class="flex justify-between"><span>Tạm tính tiền món:</span><span>${money(o.subtotal)}</span></div>
                <div class="flex justify-between"><span>Phí giao hàng:</span><span>${money(o.shippingFee)}</span></div>
                <div class="flex justify-between text-emerald-700 font-bold"><span>Phí dịch vụ:</span><span>0đ (Miễn phí)</span></div>
                <div class="flex justify-between text-sm font-extrabold text-emerald-800 border-t pt-1.5">
                  <span>Tổng thanh toán (COD):</span>
                  <span>${money(o.total)}</span>
                </div>
              </div>
              <button onclick="state.showOrderDetail=null; render();" class="w-full mt-4 py-3 bg-gray-100 rounded-xl text-xs font-bold">Đóng</button>
            </div>
          </div>
        `;
      }

      if (state.showStoreForm) {
        html += `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-2xl p-4 shadow-2xl">
              <h3 class="font-extrabold text-base pb-2 border-b">Đăng ký Cửa hàng Mới (Tuỳ ý)</h3>
              <form onsubmit="createNewStore(event)" class="space-y-3 mt-3">
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Tên cửa hàng / Quán ăn *</span><input oninput="state.newStoreForm.name=this.value;" class="field" required placeholder="Ví dụ: Quán Cơm Gà Trà Bồng" /></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Danh mục</span>
                  <select onchange="state.newStoreForm.category=this.value;" class="field">
                    <option>Đặc sản địa phương</option><option>Cơm - Món chính</option><option>Trà sữa - Ăn vặt</option><option>Chợ nông sản</option>
                  </select>
                </label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Địa chỉ cụ thể / Thôn xóm *</span><input oninput="state.newStoreForm.address=this.value;" class="field" required placeholder="Số nhà, thôn, xã Trà Bồng..." /></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Số điện thoại liên hệ *</span><input oninput="state.newStoreForm.phone=this.value;" class="field" required placeholder="09xxxxxxxx" inputmode="tel" /></label>
                <div class="flex gap-2 pt-2">
                  <button type="button" onclick="state.showStoreForm=false; render();" class="flex-1 py-3 rounded-xl border text-xs font-bold">Hủy</button>
                  <button type="submit" class="flex-1 py-3 rounded-xl bg-emerald-700 text-white font-extrabold text-xs">Tạo Cửa Hàng Ngay</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      if (state.showFoodForm) {
        html += `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-2xl p-4 shadow-2xl">
              <h3 class="font-extrabold text-base pb-2 border-b">Thêm món mới tuỳ ý</h3>
              <div class="space-y-3 mt-3">
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Tên món ăn *</span><input value="${state.foodForm.name}" oninput="state.foodForm.name=this.value;" class="field" placeholder="Ví dụ: Gà nướng muối ớt" /></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Giá bán (VNĐ) *</span><input type="number" min="0" value="${state.foodForm.price}" oninput="state.foodForm.price=this.value;" class="field" placeholder="Ví dụ: 50000" /></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Danh mục</span>
                  <select onchange="state.foodForm.category=this.value;" class="field">
                    <option ${state.foodForm.category==='Món ăn'?'selected':''}>Món ăn</option>
                    <option ${state.foodForm.category==='Đồ uống'?'selected':''}>Đồ uống</option>
                    <option ${state.foodForm.category==='Nông sản'?'selected':''}>Nông sản</option>
                  </select>
                </label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Link hình ảnh món (URL)</span><input value="${state.foodForm.image}" oninput="state.foodForm.image=this.value;" class="field" placeholder="https://images.unsplash.com/..." /></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Mô tả chi tiết</span><textarea oninput="state.foodForm.description=this.value;" class="field min-h-16" placeholder="Mô tả hương vị, thành phần...">${state.foodForm.description}</textarea></label>
                <div class="flex gap-2 pt-2">
                  <button onclick="state.showFoodForm=false; render();" class="flex-1 py-3 rounded-xl border text-xs font-bold">Hủy</button>
                  <button onclick="saveFood()" class="flex-1 py-3 rounded-xl bg-emerald-700 text-white font-extrabold text-xs">Lưu Món Mới</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (state.toast) {
        html += `
          <div class="fixed top-20 left-1/2 -translate-x-1/2 z-[70] w-[calc(100%-2rem)] max-w-md bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2">
            <span class="text-emerald-400 font-bold">✓</span> ${state.toast}
          </div>
        `;
      }

      app.innerHTML = html;

      if (state.role === 'buyer' && state.activeTab === 'home' && state.showMap) {
        setTimeout(() => initMap(selectedArea.lat, selectedArea.lng), 100);
      }
    }

    render();
  </script>
</body>
</html>
