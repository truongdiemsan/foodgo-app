<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FoodGo Local - Giao Đồ Ăn & Đặc Sản Tận Nơi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Nhúng Leaflet CSS cho Bản đồ thả ghim -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .field { width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #111827; background: #fff; outline: none; transition: all 0.2s; }
    .field:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,.15); }
    .field:disabled { background-color: #f9fafb; color: #374151; cursor: not-allowed; border-color: #f3f4f6; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .map-picker { height: 220px; width: 100%; border-radius: 1rem; z-index: 10; margin-top: 8px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="app" class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-2xl relative pb-20 border-x border-gray-200"></div>

  <!-- Leaflet JS cho Bản đồ thả ghim -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- BỘ NHỚ LƯU TRỮ CỤC BỘ SAFE-STORAGE ---
    const STORAGE = {
      stores: 'foodgo_v10_stores',
      foods: 'foodgo_v10_foods',
      cart: 'foodgo_v10_cart',
      orders: 'foodgo_v10_orders',
      favorites: 'foodgo_v10_favorites',
      profile: 'foodgo_v10_profile',
      area: 'foodgo_v10_area',
      shipping: 'foodgo_v10_shipping_fee'
    };

    const ADMINISTRATIVE_LOCATIONS = [
      { id: 'tb_trabong', name: 'Xã Trà Bồng', district: 'Trà Bồng', lat: 15.1583, lng: 108.3833 },
      { id: 'tb_dongtrabong', name: 'Xã Đông Trà Bồng', district: 'Trà Bồng', lat: 15.1700, lng: 108.4200 },
      { id: 'tb_thanhbong', name: 'Xã Thanh Bồng', district: 'Trà Bồng', lat: 15.1300, lng: 108.3500 },
      { id: 'tb_taytrabong', name: 'Xã Tây Trà Bồng', district: 'Trà Bồng', lat: 15.1900, lng: 108.3100 },
      { id: 'tb_taytra', name: 'Xã Tây Trà', district: 'Trà Bồng', lat: 15.2200, lng: 108.2800 }
    ];

    function readStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch { return fallback; }
    }

    function safeWrite(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    const savedProfile = readStorage(STORAGE.profile, { name: '', phone: '', address: '', isSaved: false, myStoreId: '', lat: 15.1583, lng: 108.3833 });

    // STATE HỆ THỐNG
    let state = {
      role: 'buyer',
      activeTab: 'home',
      selectedAreaId: readStorage(STORAGE.area, 'tb_trabong'),
      stores: readStorage(STORAGE.stores, []),
      foods: readStorage(STORAGE.foods, []),
      cart: readStorage(STORAGE.cart, []),
      orders: readStorage(STORAGE.orders, []),
      favorites: readStorage(STORAGE.favorites, []),
      profile: savedProfile,
      isEditingProfile: !savedProfile.isSaved,
      shippingFee: readStorage(STORAGE.shipping, 15000),
      serviceFee: 0,
      merchantStoreId: savedProfile.myStoreId || '',
      searchQuery: '',
      selectedCategory: 'Tất cả',
      selectedStoreId: 'all',
      selectedFood: null,
      selectedVariantId: '',
      foodQuantity: 1,
      foodNote: '',
      pendingAdd: null,
      showCheckout: false,
      showOrderDetail: null,
      showFoodForm: false,
      editingFoodId: null,
      foodForm: { name: '', price: '', category: 'Món ăn', customCategory: '', description: '', image: '' },
      showStoreForm: false,
      newStoreForm: { name: '', category: 'Đặc sản địa phương', customCategory: '', address: '', phone: '', image: '', lat: 15.1583, lng: 108.3833 },
      checkoutName: '',
      checkoutPhone: '',
      checkoutAddress: '',
      checkoutNote: '',
      checkoutError: '',
      toast: '',
      audioEnabled: false,
      isListening: false,
      showProfileMap: false,
      showStoreMap: false,
      showCheckoutMap: false
    };

    let activeMapInstance = null;
    let activeMapMarker = null;

    function saveState() {
      safeWrite(STORAGE.stores, state.stores);
      safeWrite(STORAGE.foods, state.foods);
      safeWrite(STORAGE.cart, state.cart);
      safeWrite(STORAGE.orders, state.orders);
      safeWrite(STORAGE.favorites, state.favorites);
      safeWrite(STORAGE.profile, state.profile);
      safeWrite(STORAGE.area, state.selectedAreaId);
      safeWrite(STORAGE.shipping, state.shippingFee);
    }

    function money(val) {
      return (Math.max(0, Math.round(val || 0))).toLocaleString('vi-VN') + 'đ';
    }

    function formatDate(isoStr) {
      try {
        return new Date(isoStr).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch { return isoStr; }
    }

    function showToast(msg) {
      state.toast = msg;
      render();
      setTimeout(() => { if (state.toast === msg) { state.toast = ''; render(); } }, 3500);
    }

    function handleImageUpload(input, callback) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          callback(e.target.result);
          render();
        };
        reader.readAsDataURL(file);
      }
    }

    function startVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('Trình duyệt không hỗ trợ nhận diện giọng nói. Hãy dùng Google Chrome!');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      state.isListening = true;
      showToast('🎙️ Đang nghe... Hãy nói tên món ăn bạn muốn tìm!');
      render();

      recognition.onresult = function(event) {
        const speechResult = event.results[0][0].transcript;
        state.isListening = false;
        state.searchQuery = speechResult.trim();
        state.activeTab = 'explore';
        showToast(`🎙️ Đã nhận diện: "${speechResult}"`);
        render();
      };

      recognition.onerror = function() {
        state.isListening = false;
        showToast('Không nhận diện được giọng nói. Vui lòng thử lại.');
        render();
      };

      recognition.onend = function() {
        if (state.isListening) {
          state.isListening = false;
          render();
        }
      };

      try { recognition.start(); } catch (e) { state.isListening = false; render(); }
    }

    function enableAudioAlert() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        ctx.resume().then(() => {
          state.audioEnabled = true;
          showToast('🔔 Đã bật chuông báo đơn mới!');
          render();
        });
      } catch { showToast('Trình duyệt không hỗ trợ AudioContext.'); }
    }

    function playNotificationSound() {
      if (!state.audioEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {}
    }

    const STATUS_LABEL = {
      PENDING_CONFIRMATION: 'Chờ quán xác nhận',
      ACCEPTED: 'Quán đã nhận đơn',
      PREPARING: 'Đang chuẩn bị món',
      READY_FOR_PICKUP: 'Đã nấu xong',
      DELIVERING: 'Đang giao hàng',
      COMPLETED: 'Đã hoàn thành',
      CANCELLED: 'Đã hủy'
    };

    function statusColor(status) {
      if (status === 'COMPLETED') return 'bg-emerald-100 text-emerald-800 border-emerald-300';
      if (status === 'CANCELLED') return 'bg-rose-100 text-rose-800 border-rose-300';
      if (status === 'PENDING_CONFIRMATION') return 'bg-amber-100 text-amber-800 border-amber-300';
      return 'bg-sky-100 text-sky-800 border-sky-300';
    }

    function setTab(t) { state.activeTab = t; render(); }
    function setArea(id) { state.selectedAreaId = id; state.selectedStoreId = 'all'; saveState(); render(); }
    
    function toggleFavorite(id) {
      if (state.favorites.includes(id)) state.favorites = state.favorites.filter(x => x !== id);
      else state.favorites.push(id);
      saveState();
      render();
    }

    function openFoodModal(food) {
      state.selectedFood = food;
      state.selectedVariantId = food.variants && food.variants.length ? food.variants[0].id : '';
      state.foodQuantity = 1;
      state.foodNote = '';
      render();
    }

    function requestAddToCart(food, qty = 1, variantLabel = '', unitPrice = food.price, note = '', variantDelta = 0, variantId = '') {
      const store = state.stores.find(s => s.id === food.storeId);
      if (!store || !store.isOpen) { showToast('Cửa hàng hiện đang tạm nghỉ.'); return; }
      if (!food.inStock) { showToast('Món này hiện đã hết hàng.'); return; }

      const pending = { food, variantLabel, variantId, unitPrice, variantDelta, note };
      if (state.cart.length && state.cart[0].storeId !== food.storeId) {
        state.pendingAdd = pending;
        render();
        return;
      }
      addResolvedItem(pending, qty);
    }

    function addResolvedItem(pending, qty = 1) {
      const { food, variantLabel, variantId, unitPrice, variantDelta, note } = pending;
      const store = state.stores.find(s => s.id === food.storeId);
      const cartKey = [food.id, variantId || '', variantLabel, note.trim()].join('::');
      const existing = state.cart.find(i => i.cartKey === cartKey);
      
      if (existing) {
        existing.quantity += qty;
      } else {
        state.cart.push({
          cartKey, foodId: food.id, storeId: food.storeId, storeName: store ? store.name : 'Cửa hàng',
          name: food.name, category: food.category, image: food.image, unitPrice, basePrice: food.price, variantDelta,
          quantity: qty, variantLabel: variantLabel || undefined, variantId: variantId || undefined, note: note.trim() || undefined
        });
      }
      state.pendingAdd = null;
      state.selectedFood = null;
      saveState();
      showToast(`Đã thêm ${food.name} vào giỏ hàng.`);
    }

    function updateCartQuantity(cartKey, delta) {
      const item = state.cart.find(i => i.cartKey === cartKey);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) state.cart = state.cart.filter(i => i.cartKey !== cartKey);
        saveState();
        render();
      }
    }

    function removeCartItem(cartKey) {
      state.cart = state.cart.filter(i => i.cartKey !== cartKey);
      saveState();
      render();
    }

    function startCheckout() {
      if (!state.cart.length) return;
      state.checkoutName = state.profile.name;
      state.checkoutPhone = state.profile.phone;
      state.checkoutAddress = state.profile.address || '';
      state.checkoutError = '';
      state.showCheckout = true;
      render();
    }

    function placeOrder() {
      const name = state.checkoutName.trim();
      const phone = state.checkoutPhone.trim();
      const address = state.checkoutAddress.trim();
      
      if (!name || !phone || !address) {
        state.checkoutError = 'Vui lòng nhập đầy đủ họ tên, SĐT và địa chỉ giao hàng.';
        render();
        return;
      }

      const cartStore = state.stores.find(s => s.id === state.cart[0].storeId);
      const subtotal = state.cart.reduce((s, i) => s + i.unitPrice * i.quantity, 0);
      const now = new Date().toISOString();
      const orderId = 'FG-' + new Date().getFullYear() + String(new Date().getMonth()+1).padStart(2,'0') + String(new Date().getDate()).padStart(2,'0') + '-' + Math.random().toString(36).slice(2, 7).toUpperCase();

      const newOrder = {
        id: orderId,
        storeId: cartStore.id,
        storeName: cartStore.name,
        items: [...state.cart],
        subtotal,
        shippingFee: state.shippingFee,
        serviceFee: 0,
        total: subtotal + state.shippingFee,
        status: 'PENDING_CONFIRMATION',
        customerName: name,
        customerPhone: phone,
        deliveryAddress: address,
        customerNote: state.checkoutNote.trim(),
        paymentMethod: 'COD',
        createdAt: now,
        updatedAt: now,
        events: [{ status: 'PENDING_CONFIRMATION', label: 'Khách gửi yêu cầu đặt hàng', at: now, by: 'Khách hàng' }]
      };

      state.orders.unshift(newOrder);
      state.profile = { ...state.profile, name, phone, address, isSaved: true };
      state.isEditingProfile = false;
      state.cart = [];
      state.showCheckout = false;
      state.checkoutNote = '';
      state.activeTab = 'orders';
      saveState();
      playNotificationSound();
      showToast(`Tạo đơn ${orderId} thành công! Đang đợi quán xác nhận.`);
    }

    function updateOrderStatus(orderId, status, actor) {
      const label = status === 'CANCELLED' ? `Hủy bởi ${actor}` : STATUS_LABEL[status];
      const at = new Date().toISOString();
      state.orders = state.orders.map(o => o.id === orderId ? {
        ...o, status, updatedAt: at,
        events: [...o.events, { status, label, at, by: actor }]
      } : o);
      if (state.showOrderDetail && state.showOrderDetail.id === orderId) {
        state.showOrderDetail.status = status;
        state.showOrderDetail.events.push({ status, label, at, by: actor });
      }
      saveState();
      showToast(`${orderId}: ${label}.`);
    }

    function merchantNextAction(order) {
      if (order.status === 'PENDING_CONFIRMATION') return { status: 'ACCEPTED', label: 'Chấp nhận đơn' };
      if (order.status === 'ACCEPTED') return { status: 'PREPARING', label: 'Bắt đầu làm món' };
      if (order.status === 'PREPARING') return { status: 'READY_FOR_PICKUP', label: 'Nấu xong, chờ giao' };
      if (order.status === 'READY_FOR_PICKUP') return { status: 'DELIVERING', label: 'Bắt đầu giao hàng' };
      if (order.status === 'DELIVERING') return { status: 'COMPLETED', label: 'Xác nhận hoàn tất' };
      return null;
    }

    function createNewStore(e) {
      e.preventDefault();
      const name = state.newStoreForm.name.trim();
      const phone = state.newStoreForm.phone.trim() || state.profile.phone.trim();
      const address = state.newStoreForm.address.trim() || state.profile.address.trim();
      const banner = state.newStoreForm.image.trim() || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=700&q=80';
      let category = state.newStoreForm.category;
      if (category === 'KHAC' && state.newStoreForm.customCategory.trim()) {
        category = state.newStoreForm.customCategory.trim();
      }

      if (!name) { showToast('Vui lòng điền tên cửa hàng.'); return; }
      
      const newId = 's_' + Date.now();
      const newStore = {
        id: newId,
        name,
        category,
        address,
        areaId: state.selectedAreaId,
        image: banner,
        isOpen: true,
        prepTime: '15-20 phút',
        phone
      };
      state.stores.push(newStore);
      state.merchantStoreId = newId;
      state.profile.myStoreId = newId;
      state.showStoreForm = false;
      state.role = 'merchant';
      state.newStoreForm = { name: '', category: 'Đặc sản địa phương', customCategory: '', address: '', phone: '', image: '' };
      saveState();
      showToast(`Chúc mừng! Đã tạo cửa hàng "${name}" thành công!`);
    }

    function updateStoreBanner(storeId, newImage) {
      state.stores = state.stores.map(s => s.id === storeId ? { ...s, image: newImage } : s);
      saveState();
      showToast('Đã cập nhật banner cửa hàng thành công!');
      render();
    }

    function toggleStoreOpen(storeId) {
      state.stores = state.stores.map(s => s.id === storeId ? { ...s, isOpen: !s.isOpen } : s);
      saveState();
      render();
    }

    function toggleFoodStock(foodId) {
      state.foods = state.foods.map(f => f.id === foodId ? { ...f, inStock: !f.inStock } : f);
      saveState();
      render();
    }

    function saveFood() {
      const name = state.foodForm.name.trim();
      const price = Number(state.foodForm.price);
      const desc = state.foodForm.description.trim();
      let category = state.foodForm.category;
      if (category === 'KHAC' && state.foodForm.customCategory.trim()) {
        category = state.foodForm.customCategory.trim();
      }
      const customImage = state.foodForm.image.trim() || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=700&q=80';

      if (!name || !Number.isFinite(price) || price < 0) {
        showToast('Vui lòng nhập tên món và giá bán hợp lệ.');
        return;
      }
      if (!state.merchantStoreId) {
        showToast('Vui lòng tạo cửa hàng trước khi thêm món.');
        return;
      }

      if (state.editingFoodId) {
        state.foods = state.foods.map(f => f.id === state.editingFoodId ? { ...f, name, price: Math.round(price), category, description: desc, image: customImage } : f);
        showToast('Đã cập nhật món ăn.');
      } else {
        const newFood = {
          id: 'f-' + Date.now(),
          storeId: state.merchantStoreId,
          name, price: Math.round(price),
          category,
          description: desc,
          image: customImage,
          inStock: true
        };
        state.foods.unshift(newFood);
        showToast('Đã thêm món mới thành công.');
      }
      state.showFoodForm = false;
      saveState();
      render();
    }

    function handleSaveProfile() {
      const name = state.profile.name.trim();
      const phone = state.profile.phone.trim();
      const address = state.profile.address.trim();

      if (!name || !phone || !address) {
        showToast('Vui lòng điền đầy đủ Họ tên, SĐT và Địa chỉ.');
        return;
      }

      state.profile.isSaved = true;
      state.isEditingProfile = false;
      saveState();
      showToast('Đã lưu thông tin tài khoản thành công!');
      render();
    }

    function initPinMap(containerId, initialLat, initialLng, onLocationSelect) {
      setTimeout(() => {
        const mapContainer = document.getElementById(containerId);
        if (!mapContainer) return;
        
        if (activeMapInstance) {
          activeMapInstance.remove();
          activeMapInstance = null;
        }

        activeMapInstance = L.map(containerId).setView([initialLat, initialLng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(activeMapInstance);

        activeMapMarker = L.marker([initialLat, initialLng], { draggable: true }).addTo(activeMapInstance);

        function updateAddress(lat, lng) {
          fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
            headers: { 'Accept-Language': 'vi' }
          })
          .then(res => res.json())
          .then(data => {
            const addr = data.display_name || `Kinh độ: ${lat.toFixed(4)}, Vĩ độ: ${lng.toFixed(4)}, Xã Trà Bồng`;
            onLocationSelect(addr, lat, lng);
          })
          .catch(() => {
            onLocationSelect(`Khu vực Trà Bồng (${lat.toFixed(4)}, ${lng.toFixed(4)})`, lat, lng);
          });
        }

        activeMapInstance.on('click', function(e) {
          const { lat, lng } = e.latlng;
          activeMapMarker.setLatLng([lat, lng]);
          updateAddress(lat, lng);
        });

        activeMapMarker.on('dragend', function(e) {
          const position = activeMapMarker.getLatLng();
          updateAddress(position.lat, position.lng);
        });
      }, 100);
    }

    function renderFoodCard(food) {
      const store = state.stores.find(s => s.id === food.storeId);
      const isFav = state.favorites.includes(food.id);
      return `
        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex gap-3 p-2.5">
          <button type="button" onclick="openFoodModal(state.foods.find(f => f.id === '${food.id}'))" class="w-24 h-24 shrink-0 rounded-xl overflow-hidden bg-gray-100">
            <img src="${food.image}" alt="${food.name}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x200/059669/ffffff?text=FoodGo';" />
          </button>
          <div class="min-w-0 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex items-start gap-1">
                <button type="button" onclick="openFoodModal(state.foods.find(f => f.id === '${food.id}'))" class="text-left font-bold text-sm text-gray-900 line-clamp-2 flex-1">${food.name}</button>
                <button type="button" onclick="toggleFavorite('${food.id}')" class="p-1 text-rose-500">
                  <svg class="w-4 h-4 ${isFav ? 'fill-rose-500 text-rose-500' : 'text-gray-300'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
              </div>
              <p class="text-[11px] text-gray-500 line-clamp-2 mt-1">${food.description || 'Món ngon thực tế'}</p>
              <p class="text-[10px] text-gray-400 mt-1 truncate">${store ? store.name : 'Cửa hàng'}</p>
            </div>
            <div class="flex items-center justify-between gap-2 mt-2">
              <div>
                <p class="font-extrabold text-emerald-700 text-sm">${money(food.price)}</p>
                <p class="text-[10px] ${food.inStock && store && store.isOpen ? 'text-emerald-700 font-semibold' : 'text-rose-600'}">

                  <textarea id="store-address-input" oninput="state.newStoreForm.address=this.value;" class="field min-h-16" placeholder="Số nhà, thôn, xã Trà Bồng...">${state.newStoreForm.address || state.profile.address || ''}</textarea>
                  ${state.showStoreMap ? `
                    <p class="text-[10px] text-gray-500 mt-1">Chạm/Kéo thả ghim để chọn vị trí cửa hàng:</p>
                    <div id="store-map-picker" class="map-picker border border-gray-200"></div>
                  ` : ''}
                </div>

                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Số điện thoại liên hệ</span><input value="${state.newStoreForm.phone || state.profile.phone || ''}" oninput="state.newStoreForm.phone=this.value;" class="field" placeholder="09xxxxxxxx" inputmode="tel" /></label>
                <div class="flex gap-2 pt-2">
                  <button type="button" onclick="state.showStoreForm=false; render();" class="flex-1 py-3 rounded-xl border text-xs font-bold">Hủy</button>
                  <button type="submit" class="flex-1 py-3 rounded-xl bg-emerald-700 text-white font-extrabold text-xs">Tạo Cửa Hàng Ngay</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      if (state.showFoodForm) {
        html += `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-2xl p-4 shadow-2xl max-h-[92vh] overflow-y-auto">
              <h3 class="font-extrabold text-base pb-2 border-b">Thêm món mới tuỳ ý</h3>
              <div class="space-y-3 mt-3">
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Tên món ăn *</span><input value="${state.foodForm.name}" oninput="state.foodForm.name=this.value;" class="field" placeholder="Ví dụ: Gà nướng muối ớt" /></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Giá bán (VNĐ) *</span><input type="number" min="0" value="${state.foodForm.price}" oninput="state.foodForm.price=this.value;" class="field" placeholder="Ví dụ: 50000" /></label>
                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Danh mục món</span>
                  <select onchange="state.foodForm.category=this.value; render();" class="field">
                    <option value="Món ăn" ${state.foodForm.category==='Món ăn'?'selected':''}>Món ăn</option>
                    <option value="Đồ uống" ${state.foodForm.category==='Đồ uống'?'selected':''}>Đồ uống</option>
                    <option value="Nông sản" ${state.foodForm.category==='Nông sản'?'selected':''}>Nông sản</option>
                    <option value="KHAC" ${state.foodForm.category==='KHAC'?'selected':''}>+ Danh mục khác (Tự nhập tuỳ ý)</option>
                  </select>
                </label>
                ${state.foodForm.category === 'KHAC' ? `
                  <label class="block space-y-1"><span class="text-[11px] font-bold text-emerald-700">Nhập danh mục tự chọn *</span><input value="${state.foodForm.customCategory}" oninput="state.foodForm.customCategory=this.value;" class="field border-emerald-300 bg-emerald-50" placeholder="Ví dụ: Món ăn sáng, Đồ ăn vặt..." /></label>
                ` : ''}

                <div class="space-y-1">
                  <span class="text-[11px] font-bold text-gray-700">Hình ảnh món ăn</span>
                  <div class="flex items-center gap-2">
                    <label class="flex-1 border border-dashed border-emerald-600 bg-emerald-50 hover:bg-emerald-100 rounded-xl p-3 text-center cursor-pointer transition">
                      <span class="text-xs font-bold text-emerald-800 flex items-center justify-center gap-1">
                        📷 Chụp ảnh / Tải ảnh lên
                      </span>
                      <input type="file" accept="image/*" capture="environment" onchange="handleImageUpload(this, (url) => state.foodForm.image = url)" class="hidden" />
                    </label>
                  </div>
                  ${state.foodForm.image ? `
                    <div class="relative mt-2 rounded-xl overflow-hidden border border-gray-200">
                      <img src="${state.foodForm.image}" class="w-full h-32 object-cover" />
                      <button onclick="state.foodForm.image=''; render();" class="absolute top-2 right-2 bg-rose-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-md">✕</button>
                    </div>
                  ` : ''}
                </div>

                <label class="block space-y-1"><span class="text-[11px] font-bold text-gray-700">Mô tả chi tiết</span><textarea oninput="state.foodForm.description=this.value;" class="field min-h-16" placeholder="Mô tả hương vị, thành phần...">${state.foodForm.description}</textarea></label>
                <div class="flex gap-2 pt-2">
                  <button onclick="state.showFoodForm=false; render();" class="flex-1 py-3 rounded-xl border text-xs font-bold">Hủy</button>
                  <button onclick="saveFood()" class="flex-1 py-3 rounded-xl bg-emerald-700 text-white font-extrabold text-xs">Lưu Món Mới</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (state.toast) {
        html += `
          <div class="fixed top-20 left-1/2 -translate-x-1/2 z-[70] w-[calc(100%-2rem)] max-w-md bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2">
            <span class="text-emerald-400 font-bold">✓</span> ${state.toast}
          </div>
        `;
      }

      app.innerHTML = html;

      if (state.role === 'buyer' && state.activeTab === 'profile' && state.showProfileMap && !state.profile.isSaved) {
        initPinMap('profile-map-picker', state.profile.lat || 15.1583, state.profile.lng || 108.3833, (address, lat, lng) => {
          state.profile.address = address;
          state.profile.lat = lat;
          state.profile.lng = lng;
          const input = document.getElementById('profile-address-input');
          if (input) input.value = address;
        });
      }

      if (state.showCheckout && state.showCheckoutMap) {
        initPinMap('checkout-map-picker', 15.1583, 108.3833, (address, lat, lng) => {
          state.checkoutAddress = address;
          const input = document.getElementById('checkout-address-input');
          if (input) input.value = address;
        });
      }

      if (state.showStoreForm && state.showStoreMap) {
        initPinMap('store-map-picker', 15.1583, 108.3833, (address, lat, lng) => {
          state.newStoreForm.address = address;
          state.newStoreForm.lat = lat;
          state.newStoreForm.lng = lng;
          const input = document.getElementById('store-address-input');
          if (input) input.value = address;
        });
      }
    }

    render();
  </script>
</body>
</html>
