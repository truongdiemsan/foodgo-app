<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FoodGo Local - Đặt Món Siêu Tốc Xã Trà Bồng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .field { width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 11px 12px; font-size: 13px; color: #111827; background: #fff; outline: none; transition: all 0.2s; }
    .field:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,.15); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .map-picker { height: 220px; width: 100%; border-radius: 1rem; z-index: 10; margin-top: 8px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="app" class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-2xl relative pb-24 border-x border-gray-200"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // KẾT NỐI SUPABASE CLOUD (Đã gắn sẵn URL & API Key của bạn)
    const SUPABASE_URL = 'https://rakzmchiogtdzewmnqtx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_UWma5fNOpeRxqisoflg4hQ_d_jgZ_j9';
    const supabaseClient = (typeof window.supabase !== 'undefined') 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) 
      : null;

    const STORAGE = {
      stores: 'foodgo_v12_stores',
      foods: 'foodgo_v12_foods',
      cart: 'foodgo_v12_cart',
      orders: 'foodgo_v12_orders',
      favorites: 'foodgo_v12_favorites',
      profile: 'foodgo_v12_profile',
      area: 'foodgo_v12_area'
    };

    const ADMINISTRATIVE_LOCATIONS = [
      { id: 'tb_trabong', name: 'Xã Trà Bồng', district: 'Trà Bồng' },
      { id: 'tb_dongtrabong', name: 'Xã Đông Trà Bồng', district: 'Trà Bồng' },
      { id: 'tb_thanhbong', name: 'Xã Thanh Bồng', district: 'Trà Bồng' },
      { id: 'tb_taytrabong', name: 'Xã Tây Trà Bồng', district: 'Trà Bồng' }
    ];

    function readStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch { return fallback; }
    }

    function safeWrite(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    function parseShortPrice(inputVal) {
      const num = parseInt(String(inputVal).replace(/\D/g, ''), 10);
      if (isNaN(num) || num <= 0) return 0;
      if (num < 1000) return num * 1000;
      return num;
    }

    function compressImage(file, maxWidth, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleImageUpload(input, maxWidth, callback) {
      if (input.files && input.files[0]) {
        compressImage(input.files[0], maxWidth, (compressedUrl) => {
          callback(compressedUrl);
          render();
        });
      }
    }

    const savedProfile = readStorage(STORAGE.profile, { name: '', phone: '', address: '', myStoreId: '' });

    // 4 TABS ULTRA-SIMPLE ARCHITECTURE
    let state = {
      activeTab: 'home', // 'home' | 'orders' | 'mystore' | 'profile'
      selectedAreaId: readStorage(STORAGE.area, 'tb_trabong'),
      stores: readStorage(STORAGE.stores, []),
      foods: readStorage(STORAGE.foods, []),
      cart: readStorage(STORAGE.cart, []),
      orders: readStorage(STORAGE.orders, []),
      favorites: readStorage(STORAGE.favorites, []),
      profile: savedProfile,
      searchQuery: '',
      selectedCategory: 'Tất cả',
      shippingFee: 15000,
      
      // Fast Modals
      showCheckout: false,
      fulfillmentMethod: 'DELIVERY',
      pickupTime: '11:30',
      showOrderDetail: null,
      showStoreForm: false,
      newStoreForm: { name: '', category: 'Đặc sản địa phương', address: '', phone: '', image: '' },
      showFoodForm: false,
      foodForm: { name: '', priceInput: '', category: 'Món ăn', description: '', image: '' },
      checkoutName: savedProfile.name,
      checkoutPhone: savedProfile.phone,
      checkoutAddress: savedProfile.address,
      checkoutNote: '',
      toast: '',
      isListening: false,
      showMapPicker: false
    };

    let activeMapInstance = null;
    let activeMapMarker = null;

    // TẢI DỮ LIỆU TỪ SUPABASE CLOUD KHI MỞ APP
    async function loadCloudData() {
      if (!supabaseClient) return;
      try {
        const [storesRes, foodsRes, ordersRes] = await Promise.all([
          supabaseClient.from('stores').select('*').order('created_at', { ascending: false }),
          supabaseClient.from('foods').select('*').order('created_at', { ascending: false }),
          supabaseClient.from('orders').select('*').order('created_at', { ascending: false })
        ]);

        if (storesRes.data) {
          state.stores = storesRes.data.map(s => ({
            id: s.id, name: s.name, category: s.category, address: s.address,
            areaId: s.area_id, image: s.image, isOpen: s.is_open, phone: s.phone
          }));
        }
        if (foodsRes.data) {
          state.foods = foodsRes.data.map(f => ({
            id: f.id, storeId: f.store_id, name: f.name, price: Number(f.price),
            category: f.category, description: f.description, image: f.image, inStock: f.in_stock
          }));
        }
        if (ordersRes.data) {
          state.orders = ordersRes.data.map(o => ({
            id: o.id, storeId: o.store_id, storeName: o.store_name, items: o.items || [],
            subtotal: Number(o.subtotal), shippingFee: Number(o.shipping_fee), total: Number(o.total),
            fulfillmentMethod: o.fulfillment_method, pickupTime: o.pickup_time, status: o.status,
            customerName: o.customer_name, customerPhone: o.customer_phone, deliveryAddress: o.delivery_address,
            customerNote: o.customer_note, createdAt: o.created_at
          }));
        }
        saveState();
        render();
      } catch (err) {
        console.error('Lỗi đồng bộ Cloud:', err);
      }
    }

    // LẮNG NGHE THAY ĐỔI REALTIME TỪ SUPABASE
    function setupRealtimeSync() {
      if (!supabaseClient) return;
      supabaseClient.channel('foodgo-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'stores' }, () => loadCloudData())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'foods' }, () => loadCloudData())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, (payload) => {
          loadCloudData();
          if (payload.eventType === 'INSERT' && payload.new.store_id === state.profile.myStoreId) {
            showToast(`🔔 CÓ ĐƠN HÀNG MỚI #${payload.new.id}!`);
          }
        })
        .subscribe();
    }

    function saveState() {
      safeWrite(STORAGE.stores, state.stores);
      safeWrite(STORAGE.foods, state.foods);
      safeWrite(STORAGE.cart, state.cart);
      safeWrite(STORAGE.orders, state.orders);
      safeWrite(STORAGE.favorites, state.favorites);
      safeWrite(STORAGE.profile, state.profile);
      safeWrite(STORAGE.area, state.selectedAreaId);
    }

    function money(val) {
      return (Math.max(0, Math.round(val || 0))).toLocaleString('vi-VN') + 'đ';
    }

    function formatDate(isoStr) {
      try {
        return new Date(isoStr).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      } catch { return isoStr; }
    }

    function showToast(msg) {
      state.toast = msg;
      render();
      setTimeout(() => { if (state.toast === msg) { state.toast = ''; render(); } }, 3500);
    }

    function setTab(t) { state.activeTab = t; render(); }

    function startCheckout() {
      if (!state.cart.length) return;
      state.checkoutName = state.profile.name || '';
      state.checkoutPhone = state.profile.phone || '';
      state.checkoutAddress = state.profile.address || '';
      state.showCheckout = true;
      render();
    }

    function startVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('Trình duyệt không hỗ trợ nhận diện giọng nói!');
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      state.isListening = true;
      showToast('🎙️ Đang nghe... Hãy nói tên món bạn muốn tìm!');
      render();

      recognition.onresult = function(event) {
        state.isListening = false;
        state.searchQuery = event.results[0][0].transcript.trim();
        showToast(`🎙️ Đã tìm: "${state.searchQuery}"`);
        render();
      };
      recognition.onerror = () => { state.isListening = false; render(); };
      recognition.onend = () => { if (state.isListening) { state.isListening = false; render(); } };
      try { recognition.start(); } catch { state.isListening = false; render(); }
    }

    function instantAddToCart(foodId) {
      const food = state.foods.find(f => f.id === foodId);
      if (!food) return;
      const store = state.stores.find(s => s.id === food.storeId);
      if (!store || !store.isOpen) { showToast('Quán hiện đang tạm nghỉ.'); return; }
      if (!food.inStock) { showToast('Món này đã hết.'); return; }

      if (state.cart.length && state.cart[0].storeId !== food.storeId) {
        state.cart = [];
        showToast('Đã làm mới giỏ hàng theo quán mới.');
      }

      const cartKey = food.id;
      const existing = state.cart.find(i => i.cartKey === cartKey);
      if (existing) {
        existing.quantity += 1;
      } else {
        state.cart.push({
          cartKey, foodId: food.id, storeId: food.storeId, storeName: store.name,
          name: food.name, image: food.image, unitPrice: food.price, quantity: 1
        });
      }
      saveState();
      showToast(`Đã thêm ${food.name} vào giỏ!`);
      startCheckout();
    }

    function reorderOldOrder(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;
      state.cart = order.items.map(i => ({ ...i }));
      saveState();
      startCheckout();
    }

    function placeOrder() {
      const name = state.checkoutName.trim();
      const phone = state.checkoutPhone.trim();
      const address = state.fulfillmentMethod === 'DELIVERY' ? state.checkoutAddress.trim() : 'Khách đến lấy lúc ' + state.pickupTime;

      if (!name || !phone || (state.fulfillmentMethod === 'DELIVERY' && !address)) {
        showToast('Vui lòng điền đủ thông tin nhận hàng.');
        return;
      }

      const cartStore = state.stores.find(s => s.id === state.cart[0].storeId);
      const subtotal = state.cart.reduce((s, i) => s + i.unitPrice * i.quantity, 0);
      const ship = state.fulfillmentMethod === 'DELIVERY' ? state.shippingFee : 0;
      const now = new Date().toISOString();
      const orderId = 'FG-' + Math.random().toString(36).slice(2, 7).toUpperCase();

      const newOrder = {
        id: orderId,
        storeId: cartStore ? cartStore.id : '',
        storeName: cartStore ? cartStore.name : 'Cửa hàng',
        storePhone: cartStore ? (cartStore.phone || '') : '',
        items: [...state.cart],
        subtotal,
        shippingFee: ship,
        total: subtotal + ship,
        fulfillmentMethod: state.fulfillmentMethod,
        pickupTime: state.fulfillmentMethod === 'PICKUP' ? state.pickupTime : null,
        status: 'PENDING_CONFIRMATION',
        customerName: name,
        customerPhone: phone,
        deliveryAddress: address,
        customerNote: state.checkoutNote.trim(),
        createdAt: now,
        events: [{ status: 'PENDING_CONFIRMATION', label: 'Khách gửi đơn', at: now }]
      };

      state.orders.unshift(newOrder);
      state.profile = { ...state.profile, name, phone, address: state.fulfillmentMethod === 'DELIVERY' ? address : state.profile.address };
      state.cart = [];
      state.showCheckout = false;
      saveState();

      // LƯU ĐƠN HÀNG LÊN SUPABASE CLOUD
      if (supabaseClient) {
        supabaseClient.from('orders').insert([{
          id: newOrder.id, store_id: newOrder.storeId, store_name: newOrder.storeName,
          items: newOrder.items, subtotal: newOrder.subtotal, shipping_fee: newOrder.shippingFee,
          total: newOrder.total, fulfillment_method: newOrder.fulfillmentMethod, pickup_time: newOrder.pickupTime,
          status: newOrder.status, customer_name: newOrder.customerName, customer_phone: newOrder.customerPhone,
          delivery_address: newOrder.deliveryAddress, customer_note: newOrder.customerNote, created_at: newOrder.createdAt
        }]).then(({ error }) => { if (error) console.error('Lỗi lưu đơn Cloud:', error); });
      }

      setTab('orders');
      showToast(`Đã gửi đơn hàng ${orderId} thành công!`);
    }

    function createNewStore(e) {
      e.preventDefault();
      const name = state.newStoreForm.name.trim();
      if (!name) { showToast('Vui lòng nhập tên quán.'); return; }

      const newId = 's_' + Date.now();
      const newStore = {
        id: newId,
        name,
        category: state.newStoreForm.category,
        address: state.newStoreForm.address.trim() || 'Xã Trà Bồng',
        areaId: state.selectedAreaId,
        image: state.newStoreForm.image || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=700&q=80',
        isOpen: true,
        phone: state.newStoreForm.phone.trim() || state.profile.phone || '0900000000'
      };

      state.stores.push(newStore);
      state.profile.myStoreId = newId;
      state.showStoreForm = false;
      state.newStoreForm = { name: '', category: 'Đặc sản địa phương', address: '', phone: '', image: '' };
      saveState();

      // LƯU CỬA HÀNG LÊN SUPABASE CLOUD
      if (supabaseClient) {
        supabaseClient.from('stores').insert([{
          id: newStore.id, name: newStore.name, category: newStore.category,
          address: newStore.address, area_id: newStore.areaId, image: newStore.image,
          is_open: newStore.isOpen, phone: newStore.phone
        }]).then(({ error }) => { if (error) console.error('Lỗi lưu quán Cloud:', error); });
      }

      setTab('mystore');
      showToast(`Đã tạo quán "${name}" thành công!`);
    }

    function saveFastFood() {
      const name = state.foodForm.name.trim();
      const price = parseShortPrice(state.foodForm.priceInput);
      if (!name || price <= 0) { showToast('Nhập tên món và giá tiền hợp lệ.'); return; }
      if (!state.profile.myStoreId) { showToast('Vui lòng tạo quán trước.'); return; }

      const newFood = {
        id: 'f_' + Date.now(),
        storeId: state.profile.myStoreId,
        name,
        price,
        category: state.foodForm.category,
        description: state.foodForm.description.trim(),
        image: state.foodForm.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=700&q=80',
        inStock: true
      };

      state.foods.unshift(newFood);
      state.showFoodForm = false;
      state.foodForm = { name: '', priceInput: '', category: 'Món ăn', description: '', image: '' };
      saveState();

      // LƯU MÓN ĂN LÊN SUPABASE CLOUD
      if (supabaseClient) {
        supabaseClient.from('foods').insert([{
          id: newFood.id, store_id: newFood.storeId, name: newFood.name,
          price: newFood.price, category: newFood.category, description: newFood.description,
          image: newFood.image, in_stock: newFood.inStock
        }]).then(({ error }) => { if (error) console.error('Lỗi lưu món Cloud:', error); });
      }

      showToast(`Đã đăng món "${name}" thành công!`);
    }

    function deleteFood(foodId) {
      state.foods = state.foods.filter(x => x.id !== foodId);
      saveState();
      render();
      if (supabaseClient) {
        supabaseClient.from('foods').delete().eq('id', foodId).then();
      }
      showToast('Đã xóa món khỏi thực đơn.');
    }

    function toggleStoreOpen(storeId) {
      const store = state.stores.find(s => s.id === storeId);
      if (!store) return;
      store.isOpen = !store.isOpen;
      saveState();
      render();
      if (supabaseClient) {
        supabaseClient.from('stores').update({ is_open: store.isOpen }).eq('id', storeId).then();
      }
      showToast(store.isOpen ? 'Quán đã mở bán trở lại!' : 'Quán đã chuyển sang tạm nghỉ.');
    }

    function initMap(containerId, onSelect) {
      setTimeout(() => {
        const el = document.getElementById(containerId);
        if (!el) return;
        if (activeMapInstance) { activeMapInstance.remove(); }
        activeMapInstance = L.map(containerId).setView([15.1583, 108.3833], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(activeMapInstance);
        activeMapMarker = L.marker([15.1583, 108.3833], { draggable: true }).addTo(activeMapInstance);

        function updatePos(lat, lng) {
          fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
            .then(res => res.json())
            .then(data => {
              onSelect(data.display_name || `Khu vực Trà Bồng (${lat.toFixed(4)}, ${lng.toFixed(4)})`);
            }).catch(() => onSelect(`Xã Trà Bồng (${lat.toFixed(4)}, ${lng.toFixed(4)})`));
        }

        activeMapInstance.on('click', e => {
          activeMapMarker.setLatLng(e.latlng);
          updatePos(e.latlng.lat, e.latlng.lng);
        });
        activeMapMarker.on('dragend', () => {
          const pos = activeMapMarker.getLatLng();
          updatePos(pos.lat, pos.lng);
        });
      }, 100);
    }

    function render() {
      const app = document.getElementById('app');
      const selectedArea = ADMINISTRATIVE_LOCATIONS.find(a => a.id === state.selectedAreaId) || ADMINISTRATIVE_LOCATIONS[0];
      const areaStores = state.stores.filter(s => s.areaId === state.selectedAreaId);
      const storeById = Object.fromEntries(state.stores.map(s => [s.id, s]));

      const query = state.searchQuery.trim().toLowerCase();
      const visibleFoods = state.foods.filter(f => {
        const store = storeById[f.storeId];
        const inArea = store && store.areaId === state.selectedAreaId;
        const catMatch = state.selectedCategory === 'Tất cả' || f.category === state.selectedCategory;
        const searchMatch = !query || `${f.name} ${f.description} ${store?.name || ''}`.toLowerCase().includes(query);
        return inArea && catMatch && searchMatch;
      });

      const myStore = state.stores.find(s => s.id === state.profile.myStoreId);
      const myStoreFoods = state.foods.filter(f => f.storeId === state.profile.myStoreId);
      const myStoreOrders = state.orders.filter(o => o.storeId === state.profile.myStoreId);

      let html = `
        <!-- HEADER -->
        <header class="sticky top-0 z-30 bg-emerald-800 text-white shadow-md">
          <div class="px-4 py-3 space-y-2">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-amber-400 text-emerald-950 flex items-center justify-center font-black">FG</div>
                <div>
                  <h1 class="font-extrabold text-sm leading-tight">FoodGo Local</h1>
                  <p class="text-[10px] text-emerald-100">Đặc sản Xã Trà Bồng</p>
                </div>
              </div>
              <select onchange="state.selectedAreaId=this.value; saveState(); render();" class="bg-emerald-900/80 text-white text-xs font-bold px-2 py-1.5 rounded-lg border border-emerald-600 outline-none">
                ${ADMINISTRATIVE_LOCATIONS.map(a => `<option value="${a.id}" ${a.id === state.selectedAreaId ? 'selected' : ''}>${a.name}</option>`).join('')}
              </select>
            </div>
            
            <div class="flex gap-2">
              <div class="relative flex-1">
                <input value="${state.searchQuery}" oninput="state.searchQuery=this.value; render();" placeholder="Tìm món ăn, đặc sản..." class="w-full bg-white text-gray-900 pl-8 pr-7 py-2 rounded-xl text-xs outline-none" />
                <span class="absolute left-2.5 top-2.5 text-gray-400 text-xs">🔍</span>
                ${state.searchQuery ? `<button onclick="state.searchQuery=''; render();" class="absolute right-2 top-2 text-gray-400 text-xs font-bold">✕</button>` : ''}
              </div>
              <button onclick="startVoiceRecognition()" class="bg-amber-400 text-emerald-950 px-3 py-2 rounded-xl text-xs font-bold shrink-0">
                🎙️ ${state.isListening ? 'Đang nghe...' : 'Nói'}
              </button>
            </div>
          </div>
        </header>

        <!-- MAIN CONTENT (4 TABS) -->
        <main class="px-3 pt-3 space-y-4">
      `;

      // TAB 1: TRANG CHỦ
      if (state.activeTab === 'home') {
        html += `
          <div class="rounded-2xl bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-4 shadow-sm relative overflow-hidden">
            <h2 class="text-base font-black text-amber-300">⚡ ĐẶT MÓN NHANH GỌN - GIAO TẬN NƠI</h2>
            <p class="text-[11px] text-emerald-100 mt-1">Hệ thống gọi món trực tiếp từ các quán tự do tại địa phương.</p>
          </div>

          <div class="space-y-2">
            <h3 class="font-extrabold text-sm text-gray-800">Cửa hàng thực tế tại ${selectedArea.name}</h3>
            ${areaStores.length === 0 ? `
              <div class="bg-white rounded-2xl border border-dashed border-gray-300 p-6 text-center space-y-2">
                <p class="text-xs text-gray-600">Chưa có cửa hàng nào trong khu vực này.</p>
                <button onclick="setTab('mystore')" class="bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold">✨ Đăng ký Mở Quán Ngay</button>
              </div>
            ` : `
              <div class="grid grid-cols-1 gap-2.5">
                ${areaStores.map(s => `
                  <div class="bg-white rounded-xl border border-gray-100 p-3 flex gap-3 shadow-sm items-center">
                    <img src="${s.image}" class="w-14 h-14 rounded-lg object-cover" />
                    <div class="flex-1 min-w-0">
                      <div class="flex justify-between"><b class="text-xs text-gray-900 truncate">${s.name}</b><span class="text-[10px] text-emerald-700 font-bold">${s.isOpen ? 'Đang mở' : 'Nghỉ'}</span></div>
                      <p class="text-[10px] text-gray-500 mt-0.5">${s.category} · ${s.address}</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center"><h3 class="font-extrabold text-sm text-gray-800">Thực đơn thực tế</h3></div>
            <div class="space-y-2.5">
              ${visibleFoods.length ? visibleFoods.map(f => `
                <div class="bg-white rounded-xl border border-gray-100 p-2.5 flex gap-3 shadow-sm items-center">
                  <img src="${f.image}" class="w-16 h-16 rounded-lg object-cover" />
                  <div class="flex-1 min-w-0">
                    <b class="text-xs text-gray-900 line-clamp-1">${f.name}</b>
                    <p class="text-[10px] text-gray-500 line-clamp-1 mt-0.5">${f.description || f.category}</p>
                    <p class="text-xs font-extrabold text-emerald-700 mt-1">${money(f.price)}</p>
                  </div>
                  <button onclick="instantAddToCart('${f.id}')" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-2 rounded-xl text-xs font-bold shrink-0">
                    + Đặt ngay
                  </button>
                </div>
              `).join('') : `
                <div class="bg-white rounded-2xl border border-dashed border-gray-200 p-8 text-center text-xs text-gray-500">
                  Chưa có món ăn nào. Hãy dùng nút 🎙️ <b>Nói</b> hoặc chờ chủ quán đăng món!
                </div>
              `}
            </div>
          </div>
        `;
      }

      // TAB 2: ĐƠN HÀNG
      if (state.activeTab === 'orders') {
        html += `
          <div class="space-y-3">
            <h2 class="font-extrabold text-base">Đơn hàng của tôi</h2>
            ${state.orders.length ? state.orders.map(o => `
              <div class="bg-white rounded-xl border border-gray-100 p-3 space-y-2 shadow-sm">
                <div class="flex justify-between items-start">
                  <div><p class="text-xs font-bold">${o.id} - ${o.storeName}</p><p class="text-[10px] text-gray-400">${formatDate(o.createdAt)}</p></div>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800">${o.status}</span>
                </div>
                <div class="border-t pt-1.5 space-y-1 text-xs">
                  ${o.items.map(i => `<div class="flex justify-between text-gray-600"><span>${i.name} × ${i.quantity}</span><span>${money(i.unitPrice * i.quantity)}</span></div>`).join('')}
                </div>
                <div class="border-t pt-2 flex justify-between items-center">
                  <span class="text-xs font-extrabold text-emerald-700">Tổng: ${money(o.total)}</span>
                  <button onclick="reorderOldOrder('${o.id}')" class="bg-amber-400 text-emerald-950 px-3 py-1.5 rounded-lg text-xs font-extrabold shadow-sm">
                    🔄 Đặt lại đơn này
                  </button>
                </div>
              </div>
            `).join('') : `
              <div class="bg-white rounded-2xl border border-dashed border-gray-200 p-8 text-center space-y-2">
                <p class="text-xs text-gray-500">Bạn chưa có đơn hàng nào.</p>
                <button onclick="setTab('home')" class="bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold">Khám phá thực đơn ngay</button>
              </div>
            `}
          </div>
        `;
      }

      // TAB 3: QUÁN CỦA TÔI
      if (state.activeTab === 'mystore') {
        if (!myStore) {
          html += `
            <div class="bg-white rounded-2xl border border-dashed border-emerald-300 p-8 text-center space-y-3">
              <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-xl">🏪</div>
              <h3 class="font-extrabold text-sm text-gray-900">Bạn chưa có cửa hàng trên FoodGo</h3>
              <p class="text-xs text-gray-500">Tạo gian hàng riêng của bạn chỉ với 30 giây để bắt đầu nhận đơn từ khách hàng tại Trà Bồng.</p>
              <button onclick="state.showStoreForm=true; render();" class="bg-amber-400 text-emerald-950 px-5 py-3 rounded-xl text-xs font-black shadow-md">
                ✨ Đăng Ký Tạo Cửa Hàng Ngay
              </button>
            </div>
          `;
        } else {
          html += `
            <div class="rounded-2xl bg-emerald-900 text-white p-4 space-y-2 shadow-sm">
              <div class="flex justify-between items-start">
                <div>
                  <p class="text-[10px] text-emerald-200 font-bold">QUẢN LÝ GIAN HÀNG</p>
                  <h2 class="font-black text-base mt-0.5">${myStore.name}</h2>
                  <p class="text-[11px] text-emerald-100">${myStore.address} · SĐT: ${myStore.phone}</p>
                </div>
                <button onclick="toggleStoreOpen('${myStore.id}')" class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${myStore.isOpen ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-100 text-rose-900'}">
                  ${myStore.isOpen ? 'Đang mở bán' : 'Tạm nghỉ'}
                </button>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-gray-100 p-3 space-y-3 shadow-sm">
              <div class="flex justify-between items-center">
                <h3 class="font-extrabold text-sm text-gray-800">Thực đơn quán (${myStoreFoods.length})</h3>
                <button onclick="state.showFoodForm=true; render();" class="bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold">+ Đăng Món Siêu Tốc</button>
              </div>
              <div class="space-y-2">
                ${myStoreFoods.length ? myStoreFoods.map(f => `
                  <div class="flex items-center gap-2 border-t pt-2">
                    <img src="${f.image}" class="w-12 h-12 rounded-lg object-cover" />
                    <div class="flex-1 min-w-0">
                      <b class="text-xs text-gray-900 truncate">${f.name}</b>
                      <p class="text-[11px] text-emerald-700 font-bold">${money(f.price)}</p>
                    </div>
                    <button onclick="deleteFood('${f.id}')" class="text-rose-600 text-xs font-bold px-2 py-1">Xóa</button>
                  </div>
                `).join('') : '<p class="text-xs text-gray-400 text-center py-4">Chưa có món nào. Bấm nút thêm món bên trên để bắt đầu bán!</p>'}
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-gray-100 p-3 space-y-3 shadow-sm">
              <h3 class="font-extrabold text-sm text-gray-800">Đơn hàng của quán (${myStoreOrders.length})</h3>
              ${myStoreOrders.length ? myStoreOrders.map(o => `
                <div class="border-t pt-2 space-y-1 text-xs">
                  <div class="flex justify-between font-bold"><span>${o.id} - ${o.customerName}</span><span class="text-emerald-700">${money(o.total)}</span></div>
                  <p class="text-[11px] text-gray-500">SĐT: ${o.customerPhone} · Địa chỉ: ${o.deliveryAddress}</p>
                </div>
              `).join('') : '<p class="text-xs text-gray-400 text-center py-2">Chưa có đơn mới.</p>'}
            </div>
          `;
        }
      }

      // TAB 4: TÀI KHOẢN
      if (state.activeTab === 'profile') {
        html += `
          <div class="bg-white rounded-2xl border border-gray-100 p-4 space-y-3 shadow-sm">
            <h2 class="font-extrabold text-base text-gray-900">Thông tin tài khoản</h2>
            <label class="block space-y-1"><span class="text-xs font-bold text-gray-700">Họ và tên</span><input value="${state.profile.name}" oninput="state.profile.name=this.value;" class="field" placeholder="Nhập họ và tên" /></label>
            <label class="block space-y-1"><span class="text-xs font-bold text-gray-700">Số điện thoại / Zalo</span><input value="${state.profile.phone}" oninput="state.profile.phone=this.value;" class="field" placeholder="09xxxxxxxx" inputmode="tel" /></label>
            <label class="block space-y-1"><span class="text-xs font-bold text-gray-700">Địa chỉ giao hàng</span><textarea oninput="state.profile.address=this.value;" class="field min-h-16" placeholder="Thôn, Xóm, Số nhà...">${state.profile.address || ''}</textarea></label>
            <button onclick="saveState(); showToast('Đã lưu thông tin tài khoản!');" class="w-full bg-emerald-700 text-white py-3 rounded-xl text-xs font-extrabold">Lưu thông tin</button>
          </div>
        `;
      }

      html += `</main>`;

      // BOTTOM NAV (4 TABS)
      html += `
        <nav class="fixed bottom-0 left-0 right-0 z-30 max-w-md mx-auto bg-white border-t border-gray-200 shadow-lg grid grid-cols-4 px-2 py-2">
          ${[
            ['home', '🏠', 'Trang chủ'],
            ['orders', '📋', 'Đơn hàng'],
            ['mystore', '🏬', 'Quán của tôi'],
            ['profile', '👤', 'Tài khoản']
          ].map(([t, icon, label]) => `
            <button onclick="setTab('${t}')" class="flex flex-col items-center gap-1 text-[10px] font-bold ${state.activeTab === t ? 'text-emerald-700' : 'text-gray-400'}">
              <span class="text-base">${icon}</span>
              <span>${label}</span>
            </button>
          `).join('')}
        </nav>
      `;

      // CHECKOUT MODAL
      if (state.showCheckout) {
        const subtotal = state.cart.reduce((s, i) => s + i.unitPrice * i.quantity, 0);
        const total = subtotal + (state.fulfillmentMethod === 'DELIVERY' ? state.shippingFee : 0);
        html += `
          <div class="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 max-h-[90vh] overflow-y-auto shadow-2xl">
              <div class="flex justify-between items-center pb-2 border-b"><h3 class="font-extrabold text-base">Xác nhận đặt đơn nhanh</h3><button onclick="state.showCheckout=false; render();" class="text-gray-400 font-bold">✕</button></div>
              <div class="space-y-3 mt-3">
                <div class="bg-slate-100 p-1 rounded-xl flex gap-1">
                  <button onclick="state.fulfillmentMethod='DELIVERY'; render();" class="flex-1 py-1.5 rounded-lg text-xs font-bold ${state.fulfillmentMethod==='DELIVERY'?'bg-emerald-700 text-white':''}">🛵 Giao tận nơi</button>
                  <button onclick="state.fulfillmentMethod='PICKUP'; render();" class="flex-1 py-1.5 rounded-lg text-xs font-bold ${state.fulfillmentMethod==='PICKUP'?'bg-emerald-700 text-white':''}">🛍️ Tới lấy</button>
                </div>
                <label class="block space-y-1"><span class="text-xs font-bold">Họ và tên *</span><input value="${state.checkoutName}" oninput="state.checkoutName=this.value;" class="field" /></label>
                <label class="block space-y-1"><span class="text-xs font-bold">Số điện thoại *</span><input value="${state.checkoutPhone}" oninput="state.checkoutPhone=this.value;" class="field" /></label>
                ${state.fulfillmentMethod==='DELIVERY' ? `<label class="block space-y-1"><span class="text-xs font-bold">Địa chỉ giao *</span><textarea oninput="state.checkoutAddress=this.value;" class="field">${state.checkoutAddress}</textarea></label>` : ''}
                <div class="bg-slate-50 p-3 rounded-xl text-xs space-y-1">
                  <div class="flex justify-between"><span>Tiền món:</span><b>${money(subtotal)}</b></div>
                  <div class="flex justify-between border-t pt-1 text-sm font-extrabold text-emerald-700"><span>Tổng cộng:</span><b>${money(total)}</b></div>
                </div>
                <button onclick="placeOrder()" class="w-full bg-emerald-700 text-white py-3.5 rounded-xl text-xs font-extrabold">Chốt đơn ngay · ${money(total)}</button>
              </div>
            </div>
          </div>
        `;
      }

      // CREATE STORE MODAL
      if (state.showStoreForm) {
        html += `
          <div class="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-2xl p-4 shadow-2xl">
              <h3 class="font-extrabold text-base pb-2 border-b">Tạo Cửa Hàng Nhanh</h3>
              <form onsubmit="createNewStore(event)" class="space-y-3 mt-3">
                <label class="block space-y-1"><span class="text-xs font-bold">Tên quán *</span><input oninput="state.newStoreForm.name=this.value;" class="field" required placeholder="VD: Quán Cơm Gà" /></label>
                <label class="block space-y-1"><span class="text-xs font-bold">SĐT / Zalo</span><input oninput="state.newStoreForm.phone=this.value;" class="field" placeholder="09xxxxxxxx" /></label>
                <label class="block space-y-1"><span class="text-xs font-bold">Địa chỉ quán</span><input oninput="state.newStoreForm.address=this.value;" class="field" placeholder="Thôn, xã..." /></label>
                <div class="flex gap-2 pt-2">
                  <button type="button" onclick="state.showStoreForm=false; render();" class="flex-1 py-3 border rounded-xl text-xs font-bold">Hủy</button>
                  <button type="submit" class="flex-1 py-3 bg-emerald-700 text-white rounded-xl text-xs font-extrabold">Tạo Quán Ngay</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // ADD FOOD MODAL (Đăng món siêu tốc)
      if (state.showFoodForm) {
        html += `
          <div class="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-2xl p-4 shadow-2xl">
              <h3 class="font-extrabold text-base pb-2 border-b">Đăng Món Siêu Tốc (3 Chạm)</h3>
              <div class="space-y-3 mt-3">
                <label class="block space-y-1">
                  <span class="text-xs font-bold">Hình ảnh món</span>
                  <input type="file" accept="image/*" capture="environment" onchange="handleImageUpload(this, 500, url => state.foodForm.image = url)" class="block w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" />
                </label>
                <label class="block space-y-1"><span class="text-xs font-bold">Tên món *</span><input oninput="state.foodForm.name=this.value;" class="field" placeholder="VD: Gà nướng" /></label>
                <label class="block space-y-1">
                  <span class="text-xs font-bold">Giá bán (Gõ tắt: 35 = 35.000đ) *</span>
                  <input value="${state.foodForm.priceInput}" oninput="state.foodForm.priceInput=this.value; render();" class="field" placeholder="35" />
                  ${parseShortPrice(state.foodForm.priceInput) > 0 ? `<p class='text-[10px] text-emerald-700 font-bold'>Hiển thị: ${money(parseShortPrice(state.foodForm.priceInput))}</p>` : ''}
                </label>
                <div class="flex gap-2 pt-2">
                  <button onclick="state.showFoodForm=false; render();" class="flex-1 py-3 border rounded-xl text-xs font-bold">Hủy</button>
                  <button onclick="saveFastFood()" class="flex-1 py-3 bg-emerald-700 text-white rounded-xl text-xs font-extrabold">Đăng Bán Ngay</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (state.toast) {
        html += `<div class="fixed top-20 left-1/2 -translate-x-1/2 z-[70] bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold">✓ ${state.toast}</div>`;
      }

      app.innerHTML = html;
    }

    render();
    loadCloudData();
    setupRealtimeSync();
  </script>
</body>
</html>
